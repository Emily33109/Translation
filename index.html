<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻譯實作儀表板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --line:#D9DDD8; --ink:#1B2320; --mute:#5B6661;
  --accent:#0E6B62; --accent-ink:#0A4F48; --ok-bg:#E2F0EE; --ok-line:#A9CFCA;
  --warn-bg:#FBEFD5; --warn-line:#E3C98A; --warn-ink:#6B4600;
  --bad-bg:#F6DADA; --bad-ink:#6E1F1F; --bad-line:#E2A9A9; --off-bg:#ECEEEB; --off-ink:#3F4A45;
  --ins-bg:#D8EEDF; --ins-ink:#144D2A; --del-bg:#F6DADA; --del-ink:#6E1F1F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 'Noto Sans TC',system-ui,-apple-system,'Microsoft JhengHei',sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:24px 20px 72px;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:760px;margin:0 auto;padding:40px 16px 72px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px;line-height:1.3}
h2{margin:0;font-size:18px;line-height:1.4}
h3{margin:0;font-size:16px;line-height:1.4}
p{margin:0}
.sub{color:var(--mute);font-size:14px;line-height:1.7}
.mono{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;color:var(--mute);word-break:break-word}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#3D2A00}
.card.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top .l{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.chip.t{font-family:'Noto Sans TC',sans-serif}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:700 15px 'Noto Sans TC',sans-serif;cursor:pointer}
button.ghost{background:#fff;color:var(--accent-ink);border:1px solid var(--accent)}
button.plain{background:#fff;color:var(--ink);border:1px solid #B9C0BB;font-weight:500}
button.danger{background:#fff;color:var(--bad-ink);border:1px solid var(--bad-line)}
button.sm{min-height:36px;padding:0 12px;font-size:14px}
button:disabled{background:#C9CFCB;color:#4A5450;border-color:#C9CFCB;cursor:not-allowed}
button.ghost:disabled,button.plain:disabled,button.danger:disabled{background:#F3F4F1}
label{font-size:14px;color:var(--mute)}
input[type=text],input[type=email],select,textarea{width:100%;font:400 16px/1.7 'Noto Sans TC',sans-serif;color:var(--ink);padding:8px 12px;border:1px solid #B9C0BB;border-radius:8px;background:#fff}
select{min-height:44px;padding:0 12px}
input[type=text],input[type=email]{min-height:44px}
textarea{resize:vertical;min-height:120px}
textarea.editor{min-height:200px}
textarea:read-only{background:#F3F4F1}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;color:var(--ink)}
.chk input{width:18px;height:18px;margin:0}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;background:var(--off-bg);color:var(--off-ink);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--accent-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink)}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:20px}
.side{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:20px}
.tasks{display:flex;flex-wrap:wrap;gap:8px}
.taskbtn{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid #B9C0BB;border-radius:8px;background:#fff;color:var(--ink);font:500 14px 'Noto Sans TC',sans-serif;cursor:pointer}
.taskbtn.on{border-color:var(--ink);background:var(--ink);color:#fff}
.stepper{display:flex;flex-wrap:wrap;gap:14px}
.step{flex:1 1 140px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono',monospace;border:2px solid #B9C0BB;color:var(--mute);background:#fff}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step.cur .dot{border-color:var(--accent);color:var(--accent)}
.step b{font-size:15px}
.step small{display:block;color:var(--mute);font-size:13px;line-height:1.5}
.src{white-space:pre-wrap;background:#F3F4F1;border-radius:8px;padding:12px 14px;font-size:16px;line-height:1.8;max-height:280px;min-height:80px;overflow-y:auto;resize:vertical;border:1px solid var(--line)}
.out{white-space:pre-wrap;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:8px;padding:10px 12px;line-height:1.7;max-height:220px;overflow-y:auto}
.aiscroll{display:flex;flex-direction:column;gap:10px;max-height:380px;min-height:120px;overflow-y:auto;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:8px;background:#FAFBF9}
.listscroll{max-height:320px;overflow-y:auto;padding-right:4px}
.scrollbox{max-height:320px;overflow-y:auto}
textarea.segtext{min-height:90px;max-height:240px}
.pe{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.prow.locked{background:#F3F4F1;color:var(--mute)}
.prow select{width:auto;min-width:130px;flex:0 1 190px}
.pno{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono',monospace}
.pk{font-weight:700;min-width:96px}
.perr{background:var(--bad-bg);color:var(--bad-ink);border:1px solid var(--bad-line);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.6}
.two{display:flex;flex-wrap:wrap;gap:16px}
.two>*{flex:1 1 300px;min-width:0}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box .txt{white-space:pre-wrap;line-height:1.8;max-height:260px;overflow-y:auto}
.diff{white-space:pre-wrap;line-height:1.9;font-size:16px}
.diff ins{background:var(--ins-bg);color:var(--ins-ink);text-decoration:underline;padding:0 1px}
.diff del{background:var(--del-bg);color:var(--del-ink);text-decoration:line-through;padding:0 1px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{border-bottom:2px solid var(--ink);color:var(--mute);font-size:13px;white-space:nowrap}
td.m{font:500 12px 'IBM Plex Mono',monospace;white-space:nowrap}
td.cell{max-width:340px;white-space:pre-wrap;word-break:break-word}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row .l{display:flex;flex-direction:column;flex:1 1 240px;min-width:0}
.row .l .badge{align-self:flex-start}
.row .l small{color:var(--mute);font-size:13px;line-height:1.6}
.bar{height:14px;background:var(--off-bg);border-radius:7px;overflow:hidden}
.bar>div{height:14px;background:var(--accent);width:0%}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:0 16px;border:1px solid #B9C0BB;border-radius:8px;background:#fff;color:var(--ink);font:500 15px 'Noto Sans TC',sans-serif;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:4px 18px}
.fields .chk{flex:0 1 220px}
.grid{display:flex;flex-wrap:wrap;gap:12px}
.grid>*{flex:1 1 200px;min-width:0}
.fld{display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad-ink)}
.toast.ok{background:var(--accent-ink)}
.demo-banner{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:#3D2A00;font-size:14px}
.demo-banner .btns{gap:8px}
.demo-banner button{min-height:36px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.hint{font-size:13px;color:var(--mute);line-height:1.6}
.sr{position:absolute;left:-9999px}
@media (max-width:640px){ .wrap{padding:16px 12px 64px} .card{padding:16px} }
.duty{margin-top:12px;border:1px solid var(--line,#ddd);border-radius:8px;padding:8px 12px}
.duty summary{cursor:pointer;font-weight:600}
.dutyitem h3{margin:10px 0 4px;font-size:.95rem}
.dutyitem ol{margin:0 0 6px;padding-left:1.4em}
.dutyitem li{margin:2px 0}
/* ===== 學生端精簡版面 ===== */
.stu-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.stu-top .l{display:flex;flex-direction:column;gap:6px;min-width:0}
.stu-top h1{font-size:22px}
.tagbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.barlabel{font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin-right:4px}
.pop{position:relative}
.tag{min-height:36px;padding:0 14px;border:1px solid #B9C0BB;border-radius:999px;background:#fff;color:var(--ink);font:500 14px 'Noto Sans TC',sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tag .k{color:var(--mute);font-weight:400;font-size:13px}
.tag.me{border-color:var(--accent);color:var(--accent-ink)}
.tag.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink);font-weight:700}
.tag.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tag.on .k{color:#D5DBD7}
.tag.static{cursor:default}
.popbox{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:min(360px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(20,35,30,.16);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.popbox.wide{width:min(480px,calc(100vw - 32px))}
.popbox .duty{margin-top:0}
.tagbar .taskbtn{min-height:40px}
.card.slim{padding:14px 18px;gap:10px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.flow li{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:#fff}
.flow li small{color:var(--mute);font-size:12px}
.flow .n{width:22px;height:22px;border-radius:50%;border:1px solid #B9C0BB;display:grid;place-items:center;font:500 12px 'IBM Plex Mono',monospace;color:var(--mute)}
.flow li.cur{border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.flow li.cur .n{border-color:var(--accent);color:var(--accent)}
.flow li.done{background:var(--ok-bg);border-color:var(--ok-line)}
.flow li.done .n{background:var(--accent);border-color:var(--accent);color:#fff}
.ws{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:20px;align-items:start}
.ws-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.ws-main .src{max-height:200px;min-height:64px}
.ws-side{position:sticky;height:var(--side-h);min-height:480px;padding:0;gap:0;overflow:hidden}
.sidetabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.stab{flex:1;min-height:48px;border-radius:0;background:transparent;color:var(--mute);border-bottom:2px solid transparent;font-weight:700}
.stab.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.sidebody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px}
.sidebody.gloss{overflow-y:auto}
.sidebody.gloss>.top{display:none}
.sidebody.gloss .listscroll{max-height:none;overflow:visible}
.aihead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.chat-empty{margin:auto 0;display:flex;flex-direction:column;gap:6px;text-align:center;color:var(--mute);padding:16px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:88%;min-width:0}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.a{align-self:flex-start}
.bub{white-space:pre-wrap;word-break:break-word;padding:9px 13px;border-radius:14px;line-height:1.7;font-size:15px}
.msg.u .bub{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.a .bub{background:var(--ok-bg);border:1px solid var(--ok-line);border-bottom-left-radius:4px}
.msg .meta{font:500 11px 'IBM Plex Mono',monospace;color:var(--mute)}
.msg .acts{display:flex;gap:6px}
.msg .acts button{min-height:30px;padding:0 10px;font-size:13px}
.composer{flex:none;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:52px;max-height:140px;resize:vertical}
.composer .row2{display:flex;align-items:center;gap:8px}
.composer .grow{flex:1}
@media (max-width:980px){
  .ws{grid-template-columns:minmax(0,1fr)}
  .ws-side{position:static;height:auto;min-height:0}
  .chat{max-height:60vh;min-height:260px}
}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let pendingValue;
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "value") pendingValue = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "checked" || k === "disabled" || k === "readOnly" || k === "selected" || k === "multiple") el[k] = !!v;
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  const add = (c) => {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(add); return; }
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  if (pendingValue !== undefined) el.value = pendingValue;
  return el;
}

function toDate(x) {
  if (!x) return null;
  if (typeof x.toDate === "function") return x.toDate();
  if (x instanceof Date) return x;
  if (typeof x === "number") return new Date(x);
  return null;
}
const tms = (x) => { const d = toDate(x); return d ? d.getTime() : 0; };
const recMs = (r) => tms(r.at) || r.clientTime || tms(r.createdAt) || tms(r.updatedAt) || 0;
const byTime = (a, b) => recMs(a) - recMs(b);

/* ---------- 把長原文切成一段一段 ---------- */
function splitSource(text, target) {
  target = Math.max(30, +target || 150);
  text = String(text || "").replace(/\r/g, "").trim();
  if (!text) return [];
  const pieces = [];
  text.split(/\n\s*\n+/).map((x) => x.trim()).filter(Boolean).forEach((p) => {
    if (p.length <= target * 1.5) { pieces.push(p); return; }
    const sents = p.match(/[^。！？；!?;\n]+[。！？；!?;]*\n?/g) || [p];
    let cur = "";
    sents.forEach((x) => { if (cur && (cur + x).length > target) { pieces.push(cur.trim()); cur = x; } else cur += x; });
    if (cur.trim()) pieces.push(cur.trim());
  });
  const out = [];
  pieces.forEach((p) => {
    const last = out[out.length - 1];
    if (last !== undefined && last.length < target * 0.4 && (last + "\n\n" + p).length <= target * 1.5) out[out.length - 1] = last + "\n\n" + p;
    else out.push(p);
  });
  return out;
}
// 一分為二：在中間附近最近的句號切開
function halveSegment(text) {
  text = String(text || "");
  if (text.length < 20) return [text];
  const mid = Math.floor(text.length / 2);
  let best = -1, dist = 1e9;
  const re = /[。！？；!?;\n]/g;
  let m;
  while ((m = re.exec(text))) { const d = Math.abs(m.index + 1 - mid); if (m.index + 1 < text.length && d < dist) { dist = d; best = m.index + 1; } }
  if (best < 0) best = mid;
  return [text.slice(0, best).trim(), text.slice(best).trim()].filter(Boolean);
}

/* ---------- 流程（步驟清單）檢查 ----------
   ctx: { translators:[anonId], reviewers:[anonId], pm:anonId, name:(anonId)=>string, from:數字（這個索引之前的步驟已完成，不再檢查） }
   規則：第一步是翻譯、最後一步是 PM 的最終檢查；每一步的人要有對應角色；審校的人不能是這段翻過或改過的人。 */
function planProblems(plan, ctx) {
  const errs = [];
  const nm = ctx.name || ((a) => a);
  if (!plan.length) return ["流程是空的"];
  if (plan[plan.length - 1].kind !== "final") errs.push("最後一步必須是 PM 的最終檢查");
  if (plan.filter((x) => x.kind === "final").length > 1 && plan.slice(0, -1).some((x) => x.kind === "final" && !x.done)) errs.push("最終檢查只能放在最後");
  const authors = new Set(plan.filter((x) => x.kind === "translate" || x.kind === "revise").map((x) => x.anonId).filter(Boolean));
  plan.forEach((s, i) => {
    if (i < (ctx.from || 0)) return;
    const lab = "第 " + (i + 1) + " 步（" + STEP_KINDS[s.kind].label + "）";
    if (!s.anonId) { errs.push(lab + "還沒有選人"); return; }
    if (s.kind === "final" || s.kind === "pmcheck") { if (s.anonId !== ctx.pm) errs.push(lab + "必須是 PM"); return; }
    if (s.kind === "review") {
      if (!ctx.reviewers.includes(s.anonId)) errs.push(lab + "：" + nm(s.anonId) + " 沒有 Reviewer 角色");
      if (authors.has(s.anonId)) errs.push(lab + "：" + nm(s.anonId) + " 翻譯或修改過這一段，不能審自己的譯文");
    } else if (!ctx.translators.includes(s.anonId)) errs.push(lab + "：" + nm(s.anonId) + " 沒有 Translator 角色");
  });
  return errs;
}

/* ---------- 文字差異（逐字） ---------- */
function diffSeq(A, B, limit) {
  let s = 0;
  while (s < A.length && s < B.length && A[s] === B[s]) s++;
  let ea = A.length, eb = B.length;
  while (ea > s && eb > s && A[ea - 1] === B[eb - 1]) { ea--; eb--; }
  const a = A.slice(s, ea), b = B.slice(s, eb);
  const n = a.length, m = b.length;
  if (limit && n * m > limit) return null;
  const ops = [];
  for (let i = 0; i < s; i++) ops.push(["eq", A[i]]);
  if (n === 0) { for (const x of b) ops.push(["ins", x]); }
  else if (m === 0) { for (const x of a) ops.push(["del", x]); }
  else {
    const w = m + 1;
    const dp = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i * w + j] = a[i] === b[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
      }
    }
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push(["eq", a[i]]); i++; j++; }
      else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) { ops.push(["del", a[i]]); i++; }
      else { ops.push(["ins", b[j]]); j++; }
    }
    while (i < n) ops.push(["del", a[i++]]);
    while (j < m) ops.push(["ins", b[j++]]);
  }
  for (let i = ea; i < A.length; i++) ops.push(["eq", A[i]]);
  return ops;
}
function normLang(x) {
  const v = String(x || "").trim().toLowerCase();
  if (!v) return "";
  if (["en", "english", "英", "英文", "英語", "中翻英"].includes(v)) return "en";
  if (["ja", "jp", "japanese", "日", "日文", "日語", "日本語", "中翻日"].includes(v)) return "ja";
  if (["de", "german", "deutsch", "德", "德文", "德語", "中翻德"].includes(v)) return "de";
  return "";
}
function langOf(t) { return (t && LANGS[t.lang] && t.lang) || (typeof S !== "undefined" && S.me && LANGS[S.me.lang] && S.me.lang) || "en"; }
const isLatin = (lang) => !!(LANGS[lang] && LANGS[lang].latin);
// 拉丁字母語言（英、德）用「字」比對，日文用「字元」比對
function tokensFor(text, lang) {
  text = String(text || "");
  if (isLatin(lang)) return text.match(/\s+|[\p{L}\p{N}'’\-]+|[^\s\p{L}\p{N}]/gu) || [];
  return Array.from(text);
}
function diffText(a, b, lang) {
  a = a || ""; b = b || "";
  let ops = diffSeq(tokensFor(a, lang), tokensFor(b, lang), 4000000);
  if (!ops) {
    const la = a.split("\n"), lb = b.split("\n");
    ops = diffSeq(la, lb, 0).map(([t, x]) => [t, x + "\n"]);
  }
  const out = [];
  for (const [t, x] of ops) {
    const last = out[out.length - 1];
    if (last && last.t === t) last.s += x; else out.push({ t, s: x });
  }
  return out;
}
function diffEl(a, b, lang) {
  const parts = diffText(a, b, lang);
  if (parts.length === 0) return h("span", { class: "diff" }, "（沒有內容）");
  if (parts.every((p) => p.t === "eq")) {
    return h("span", { class: "diff" }, parts.map((p) => p.s), h("div", { class: "hint" }, "兩個版本的文字完全相同。"));
  }
  return h("span", { class: "diff" }, parts.map((p) => p.t === "eq" ? p.s : h(p.t === "del" ? "del" : "ins", null, p.s)));
}

/* ---------- AI 內容與最終文字的相似度（字元 bigram） ---------- */
function bigrams(s, lang) {
  const m = new Map();
  const add = (g) => m.set(g, (m.get(g) || 0) + 1);
  if (isLatin(lang)) {
    const w = (String(s || "").toLowerCase().match(/[\p{L}\p{N}]+/gu)) || [];
    if (w.length < 2) w.forEach(add);
    else for (let i = 0; i < w.length - 1; i++) add(w[i] + " " + w[i + 1]);
    return m;
  }
  s = String(s || "").replace(/\s+/g, "");
  for (let i = 0; i < s.length - 1; i++) add(s.slice(i, i + 2));
  return m;
}
function overlapScores(aiText, finalText, lang) {
  const A = bigrams(aiText, lang), B = bigrams(finalText, lang);
  let inter = 0, na = 0, nb = 0;
  A.forEach((v, k) => { na += v; if (B.has(k)) inter += Math.min(v, B.get(k)); });
  B.forEach((v) => { nb += v; });
  return {
    dice: na + nb === 0 ? 0 : (2 * inter) / (na + nb),
    contained: na === 0 ? 0 : inter / na
  };
}

/* ---------- CSV / 下載 ---------- */
function toCsv(rows, fields) {
  const esc = (v) => {
    if (v === null || v === undefined) return "";
    if (typeof v === "object") v = JSON.stringify(v);
    v = String(v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  return "﻿" + [fields.join(",")].concat(rows.map((r) => fields.map((f) => esc(r[f])).join(","))).join("\r\n");
}
function parseCsv(text) {
  text = String(text || "").replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const delim = first.includes("\t") ? "\t" : ",";
  const rows = [];
  let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.some((x) => x.trim() !== "")) rows.push(row);
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.some((x) => x.trim() !== "")) rows.push(row);
  return rows.map((r) => r.map((x) => x.trim()));
}
function download(name, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function flatten(rec) {
  const o = {};
  for (const [k, v] of Object.entries(rec)) {
    if (v && typeof v.toDate === "function") o[k] = v.toDate().toISOString();
    else if (v && typeof v === "object") o[k] = JSON.parse(JSON.stringify(v, (kk, vv) => (vv && typeof vv.toDate === "function" ? vv.toDate().toISOString() : vv)));
    else o[k] = v;
  }
  return o;
}
function cleanThink(t) {
  return String(t || "").replace(/<think>[\s\S]*?<\/think>/g, "").replace(/<think>[\s\S]*$/, "").trim();
}
function randId(n) {
  const c = "abcdefghijklmnopqrstuvwxyz0123456789";
  let s = "";
  const a = new Uint32Array(n);
  crypto.getRandomValues(a);
  for (let i = 0; i < n; i++) s += c[a[i] % c.length];
  return s;
}

function makeDemoFirebase() {
  const revive = (k, v) => (v && typeof v === "object" && typeof v.__ts === "number" ? new DemoTs(v.__ts) : v);
  const load = () => { const raw = demoStore.get(DEMO_KEY); if (raw) { try { return JSON.parse(raw, revive); } catch (e) {} } return null; };
  let DB = load();
  if (!DB) { DB = demoSeed(); demoStore.set(DEMO_KEY, JSON.stringify(DB)); }
  const listeners = new Set();
  const authCbs = new Set();
  const clone = (v) => JSON.parse(JSON.stringify(v), revive);
  const stamp = (v) => {
    if (v === DEMO_SERVER_TS || (v && v.__serverTs)) return new DemoTs(Date.now());
    if (Array.isArray(v)) return v.map(stamp);
    if (v && typeof v === "object" && !(v instanceof DemoTs)) { const o = {}; for (const k in v) if (v[k] !== undefined) o[k] = stamp(v[k]); return o; }
    return v;
  };
  const save = () => { demoStore.set(DEMO_KEY, JSON.stringify(DB)); notify(); };
  let pending = 0;
  const notify = () => { if (pending) return; pending = setTimeout(() => { pending = 0; listeners.forEach((l) => l.fire()); }, 0); };
  window.addEventListener("storage", (e) => { if (e.key === DEMO_KEY) { DB = load() || demoSeed(); notify(); } });
  let seq = 0;
  const autoId = () => "d" + Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 6);
  const table = (path) => (DB[path] = DB[path] || {});
  const docSnap = (ref) => {
    const d = (DB[ref.parent] || {})[ref.id];
    return { id: ref.id, ref, exists: () => d !== undefined, data: () => (d === undefined ? undefined : clone(d)) };
  };
  const runQuery = (q) => {
    const rows = Object.entries(DB[q.path] || {}).filter(([, d]) => q.filters.every(([f, , v]) => d[f] === v));
    const docs = rows.map(([id]) => docSnap({ type: "doc", parent: q.path, id }));
    return { docs, size: docs.length, empty: !docs.length, forEach: (fn) => docs.forEach(fn) };
  };
  const write = (ref, data, merge) => {
    const t = table(ref.parent);
    const v = stamp(data);
    t[ref.id] = merge && t[ref.id] ? Object.assign({}, t[ref.id], v) : v;
  };
  const F = {
    initializeApp: () => ({}), getAuth: () => ({}), getFirestore: () => ({}),
    GoogleAuthProvider: function () { this.setCustomParameters = () => {}; },
    onAuthStateChanged(auth, cb) {
      authCbs.add(cb);
      const raw = demoStore.get(DEMO_USER_KEY, true);
      setTimeout(() => cb(raw ? JSON.parse(raw) : null), 0);
      return () => authCbs.delete(cb);
    },
    signInWithPopup: async () => {}, signInWithRedirect: async () => {},
    async signOut() { demoStore.del(DEMO_USER_KEY, true); authCbs.forEach((cb) => cb(null)); },
    demoSignIn(email, name) {
      const u = { email, uid: "demo-" + email, displayName: name || email };
      demoStore.set(DEMO_USER_KEY, JSON.stringify(u), true);
      authCbs.forEach((cb) => cb(u));
    },
    demoReset() { DB = demoSeed(); save(); },
    demoRoster() {
      const sid = (DB.settings && DB.settings.app && DB.settings.app.activeSessionId) || "";
      const gr = (DB.groupRoles || {});
      return Object.values(DB.roster || {}).filter((r) => r.sessionId === sid).map((r) => {
        const g = gr[sid + "~" + r.groupId] || {};
        const roles = [];
        if (r.pm) roles.push("PM");
        if ((g.translators || []).includes(r.anonId)) roles.push("Translator");
        if ((g.reviewers || []).includes(r.anonId)) roles.push("Reviewer");
        return Object.assign({ roles }, r);
      }).sort((a, b) => (a.groupId + a.anonId).localeCompare(b.groupId + b.anonId));
    },
    serverTimestamp: () => DEMO_SERVER_TS,
    collection: (db, ...p) => ({ type: "query", path: p.join("/"), filters: [] }),
    doc(a, ...p) {
      if (a && a.type === "query") return { type: "doc", parent: a.path, id: autoId() };
      return { type: "doc", parent: p.slice(0, -1).join("/"), id: p[p.length - 1] };
    },
    where: (f, op, v) => [f, op, v],
    query: (c, ...w) => ({ type: "query", path: c.path, filters: c.filters.concat(w) }),
    async getDoc(ref) { return docSnap(ref); },
    async getDocs(q) { return runQuery(q); },
    async setDoc(ref, data, opt) { write(ref, data, opt && opt.merge); save(); },
    async addDoc(c, data) { const ref = F.doc(c); write(ref, data, false); save(); return ref; },
    async deleteDoc(ref) { delete table(ref.parent)[ref.id]; save(); },
    onSnapshot(target, next, err) {
      const l = { fire: () => { try { next(target.type === "doc" ? docSnap(target) : runQuery(target)); } catch (e) { if (err) err(e); else console.error(e); } } };
      listeners.add(l);
      setTimeout(l.fire, 0);
      return () => listeners.delete(l);
    },
    writeBatch() {
      const ops = [];
      return {
        set: (ref, data, opt) => { ops.push(() => write(ref, data, opt && opt.merge)); },
        update: (ref, data) => { ops.push(() => write(ref, data, true)); },
        delete: (ref) => { ops.push(() => { delete table(ref.parent)[ref.id]; }); },
        async commit() { ops.forEach((o) => o()); save(); }
      };
    },
    async runTransaction(db, fn) {
      const ops = [];
      const tx = {
        get: async (ref) => docSnap(ref),
        set: (ref, data, opt) => { ops.push(() => write(ref, data, opt && opt.merge)); return tx; },
        update: (ref, data) => { ops.push(() => write(ref, data, true)); return tx; },
        delete: (ref) => { ops.push(() => { delete table(ref.parent)[ref.id]; }); return tx; }
      };
      const r = await fn(tx);
      ops.forEach((o) => o());
      save();
      return r;
    }
  };
  return F;
}

async function handleAuth(user) {
  cleanup();
  if (!user) { S.user = null; S.email = ""; S.view = "login"; rr(); return; }
  S.user = user;
  S.email = (user.email || "").toLowerCase();
  S.view = "loading";
  rr();
  try {
    S.isTeacher = TEACHER_EMAILS.map((x) => x.toLowerCase()).includes(S.email) || (DEMO_MODE && S.email === DEMO_TEACHER);
    const sSnap = await S.F.getDoc(dref("settings", "app"));
    S.settings = sSnap.exists() ? sSnap.data() : null;

    if (!S.settings || !S.settings.activeSessionId) { S.view = "nosession"; rr(); return; }

function subscribeTasks() {
  const q = S.F.query(col("tasks"), S.F.where("sessionId", "==", S.sid), S.F.where("groupId", "==", S.me.groupId));
  S.unsubs.push(S.F.onSnapshot(q, (snap) => {
    if (!S.me) return;
    // 舊版格式的任務（沒有 plan 流程）無法在新版使用，直接略過，避免畫面出錯
    S.tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((t) => Array.isArray(t.plan) && t.plan.length).sort((a, b) => byTime(a, b) || String(a.code).localeCompare(String(b.code)));
    if (S.pendingPick && S.tasks.find((t) => t.id === S.pendingPick)) { S.taskId = S.pendingPick; S.pendingPick = ""; }
    if (!S.taskId || !S.tasks.find((t) => t.id === S.taskId)) {
      // 一開始先顯示「現在輪到我」的那一段；沒有的話顯示最後一段
      const mine = S.tasks.find((t) => { const st = curStep(t); return st && S.me && st.anonId === S.me.anonId; });

    rr();

function watchTask() {
  if (S.watched === S.taskId) return;
  S.taskUnsubs.forEach((u) => { try { u(); } catch (e) {} });

  S.versions = []; S.events = []; S.myAi = [];
  S.dr = { taskId: S.taskId, text: "", comments: {}, baseKey: "", saved: 0, loaded: false };
  S.cmpA = ""; S.cmpB = ""; S.retTarget = ""; S.pe = null;
  if (!S.taskId) return;

  S.taskUnsubs.push(S.F.onSnapshot(S.F.collection(S.db, "tasks", tid, "versions"), (snap) => {
    S.versions = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(byTime);

const draftId = (tid) => tid + "~" + S.me.anonId;
async function loadDraft(tid) {
  try {
    const d = await S.F.getDoc(dref("drafts", draftId(tid)));
    if (S.taskId !== tid) return;

      const x = d.data();
      S.dr = { taskId: tid, text: x.text || "", comments: x.comments || {}, baseKey: x.baseKey || "", openedAt: x.openedAt || null, saved: tms(x.updatedAt) || x.clientTime || 0, loaded: true };
    } else S.dr.loaded = true;
  } catch (e) { S.dr.loaded = true; console.error(e); }
  rr();
}
/* 為了節省 Firestore 的每日寫入額度：草稿最多每 10 秒存一次（不是每次停頓都存），
   內容沒變就不寫；切換分頁、提交前會立刻存。 */
const DRAFT_SAVE_MS = 10000;
let saveTimer = 0;
function scheduleSave() {
  S.dirty = true;
  if (saveTimer) return;
  saveTimer = setTimeout(saveDraftNow, DRAFT_SAVE_MS);
}
const draftSig = () => S.dr.text + "\u0001" + JSON.stringify(S.dr.comments || {});
async function saveDraftNow() {
  clearTimeout(saveTimer); saveTimer = 0;
  const t = curTask();
  if (!t || !S.me || !S.dr.loaded) return;
  if (S.dr.sig === draftSig()) { S.dirty = false; return; }
  try {
    const sig = draftSig();
    await S.F.setDoc(dref("drafts", draftId(t.id)), {
      taskId: t.id, sessionId: S.sid, groupId: S.me.groupId, anonId: S.me.anonId, role: S.me.roleLabel,
      text: S.dr.text, comments: S.dr.comments, baseKey: S.dr.baseKey, openedAt: S.dr.openedAt || null,
      updatedAt: S.F.serverTimestamp(), clientTime: Date.now()
    });
    S.dr.saved = Date.now();
    S.dr.sig = sig;
    S.dirty = !!saveTimer;
  } catch (e) { console.error(e); toast("草稿儲存失敗：" + friendly(e), "bad"); }
  updateSavedLabel();
}
function updateSavedLabel() {
  const c = document.getElementById("cnt");
  if (c) c.textContent = S.dr.text.length + " 字" + (S.dr.saved ? "　草稿已儲存 " + fmtShort(S.dr.saved).slice(6) : "");
}

async function aiEnvCheck() {
  const ua = navigator.userAgent;
  const m = ua.match(/(Edg|Chrome)\/(\d+)/);
  const env = {
    browserName: m ? (m[1] === "Edg" ? "Edge" : "Chrome") : "其他瀏覽器",
    ver: m ? parseInt(m[2], 10) : 0,
    secure: !!window.isSecureContext,
    webgpu: !!navigator.gpu, adapter: false, gpuName: "", f16: false, maxMB: 0
  };
  env.browserOk = !!m && env.ver >= 113;
  if (navigator.gpu) {
    try {
      const ad = await navigator.gpu.requestAdapter();
      if (ad) {
        env.adapter = true;
        let info = ad.info || null;
        if (!info && ad.requestAdapterInfo) { try { info = await ad.requestAdapterInfo(); } catch (e) {} }
        env.gpuName = info ? [info.vendor, info.architecture, info.description].filter(Boolean).join(" / ") : "";
        env.integrated = /intel/i.test(env.gpuName) && !/nvidia|amd/i.test(env.gpuName);
        env.f16 = !!(ad.features && ad.features.has("shader-f16"));
        env.maxMB = ad.limits ? Math.round(ad.limits.maxBufferSize / 1048576) : 0;
      }
    } catch (e) {}
  }
  return env;
}

  if (!r.ok) throw new Error("Colab 伺服器回應錯誤（" + r.status + "）。可能還在啟動中，請稍後再試。");

/* 把串流回應轉成和 WebLLM 一樣格式的片段 */
async function* colabStream(req) {
  const body = Object.assign({}, req);
  delete body.extra_body;
  const r = await fetch(COLAB_API_URL.replace(/\/$/, "") + "/chat/completions", { method: "POST", headers: colabHeaders(), body: JSON.stringify(body) });
  if (!r.ok) {
    const t = await r.text().catch(() => "");
    throw new Error("Colab 伺服器回應錯誤（" + r.status + "）" + (r.status === 503 ? "：伺服器忙碌中，請稍後再試。" : "：" + t.slice(0, 200)));
  }
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") return;
        try { yield JSON.parse(data); } catch (e) {}
      }
    }
  } finally {
    try { reader.cancel(); } catch (e) {}

      : "載入失敗：" + msg;

/* 產生回應。回傳 { response, original, converted, seconds, tokens, finish } */
async function aiGenerate(userPrompt, mode, lang, hits) {
  lang = LANGS[lang] ? lang : "en";
  hits = hits || [];
  if (AI.status !== "ready" || (!AI.engine && !IS_COLAB)) throw new Error("AI 尚未載入");
  if (mode === "free") await ensureConverter();
  let sysText = mode === "translate" ? LANGS[lang].sys : sysFree(lang);
  if (hits.length) sysText += mode === "translate"
    ? "\n\nGlossary (use these exact terms 中文 = target):\n" + glossLines(hits)
    : "\n\n本組術語表（中文 = " + LANGS[lang].name + "）：\n" + glossLines(hits);
  const messages = [{ role: "system", content: sysText }];
  if (mode === "translate") {
    messages.push({ role: "user", content: aiInstr(lang) + "\n\n" + FEW_SRC });
    messages.push({ role: "assistant", content: LANGS[lang].fewOut });
  }
  // 簡轉繁只用在中文回答（自由提問）。翻譯結果是外文，不能轉換，日文的漢字更不能被轉成中文寫法。
  const conv = (t) => (mode === "free" && !hasKana(t)) ? toTW(t) : t;
  messages.push({ role: "user", content: userPrompt });
  const req = { messages, temperature: 0.2, max_tokens: 768, stream: true, stream_options: { include_usage: true } };
  if (AI.modelId.startsWith("Qwen3")) req.extra_body = { enable_thinking: false };
  const t0 = performance.now();
  let raw = "", usage = null, finish = "", n = 0;
  const chunks = AI.sim ? demoStream(req) : IS_COLAB ? colabStream(req) : await AI.engine.chat.completions.create(req);
  for await (const c of chunks) {
    if (AI.stop) { if (!IS_COLAB) { try { AI.engine.interruptGenerate(); } catch (e) {} } break; }
    n++;
    const ch = c.choices && c.choices[0];
    if (ch && ch.finish_reason) finish = ch.finish_reason;
    const d = ch && ch.delta && ch.delta.content;
    if (d) { raw += d; AI.live = conv(cleanThink(raw)); aiLiveUpdate(); }
    if (c.usage) usage = c.usage;
  }
  const seconds = Number(((performance.now() - t0) / 1000).toFixed(2));
  const original = cleanThink(raw);
  const response = conv(original);
  if (raw === "") throw new Error("模型沒有產生任何文字（收到 " + n + " 個片段，結束原因：" + (finish || "無") + "）。請重新載入頁面再試。");
  if (original === "") throw new Error("模型只輸出了思考內容，沒有譯文。請換個說法再問一次。");
  return { response, original, converted: response !== original, seconds, tokens: usage ? usage.completion_tokens : null, finish };
}

/* ---------- 學生端：送出提問並記錄 ---------- */
async function aiSend(mode) {
  const t = curTask();
  if (!t || AI.busy || AI.status !== "ready") return;
  const lang = langOf(t);
  const prompt = mode === "translate" ? aiInstr(lang) + "\n\n" + t.sourceText : (S.aiPrompt || "").trim();
  if (!prompt) { toast("請先輸入要問 AI 的內容", "bad"); return; }
  AI.busy = true; AI.live = ""; AI.liveFor = t.id; AI.stop = false; AI.liveMode = mode; AI.livePrompt = mode === "free" ? prompt : ""; rr();
  try {
    const hits = glossHits(mode === "translate" ? t.sourceText : prompt);
    const r = await aiGenerate(prompt, mode, lang, hits);
    const doc = {
      taskId: t.id, taskCode: t.code, sessionId: S.sid, groupId: S.me.groupId, anonId: S.me.anonId,
      indTaskId: t.code + "-" + S.me.anonId, role: actingRole(t), lang, glossaryHits: hits.map((g) => g.src + " = " + g.tgt), model: AI.modelId, mode, prompt,
      response: r.response, modelOriginal: r.original, convertedToTraditional: r.converted,
      seconds: r.seconds, completionTokens: r.tokens, finishReason: r.finish,
      at: S.F.serverTimestamp(), clientTime: Date.now()
    };
    let saved = false;
    for (let i = 0; i < 2 && !saved; i++) {
      try { await S.F.addDoc(col("aiLogs"), doc); saved = true; } catch (e) { if (i === 1) throw e; }
    }
    try { await logEvent(t, "ai_prompt", { detail: mode }); } catch (e) { console.error(e); }
    if (mode === "free") S.aiPrompt = "";
  } catch (e) {
    console.error(e);
    toast("AI 發生問題：" + friendly(e), "bad");
  } finally {
    AI.busy = false; AI.live = ""; rr();
  }
}

function editMode(t) {

function seedDraft(t, mode) {

function aiMatchFor(text) {

}

const planCtx = (from) => Object.assign({ pm: pmAnon(), name: nameOf, from: from || 0 }, rolesIn());
const stripPlan = (plan) => plan.map((s) => ({ kind: s.kind, anonId: s.anonId }));
const planSummary = (plan) => plan.map((s) => STEP_KINDS[s.kind].short + ":" + s.anonId).join(" → ");

/* ---------- 組員角色（PM 一次指定） ---------- */
async function saveRoles(ed) {
  if (!S.me.isPM) throw new Error("只有 PM 可以指定組員角色");

  if (!reviewers.length) throw new Error("至少要有一位 Reviewer");
  const F = S.F;
  const batch = F.writeBatch(S.db);
  batch.set(dref("groupRoles", S.sid + "~" + S.me.groupId), {
    sessionId: S.sid, groupId: S.me.groupId, pm: pmAnon(), translators, reviewers,

  await batch.commit();
  S.rolesEd = null;
  S.showRoles = false;
}

/* ---------- 切段與派發（PM） ---------- */
function defaultPlan(i) {
  const R = rolesIn(), pm = pmAnon();
  const tr = R.translators.length ? R.translators[i % R.translators.length] : "";
  const rvs = R.reviewers.filter((a) => a !== tr);
  const rv = rvs.length ? rvs[i % rvs.length] : "";
  return [{ kind: "translate", anonId: tr }, { kind: "review", anonId: rv }, { kind: "revise", anonId: tr }, { kind: "final", anonId: pm }];
}
function startSeg(item) {
  // 先整篇放進第 1 段；PM 自己把要分出去的部分剪下、貼到「新增一段」
  S.seg = { bankId: item.id, title: item.title, parts: [{ text: item.sourceText.trim(), plan: defaultPlan(0) }] };
}
async function dispatchSegments() {
  const sg = S.seg;
  if (!sg || !sg.parts.length) throw new Error("沒有可派發的段落");
  const ctx = planCtx(0);
  sg.parts.forEach((p, i) => {
    if (!p.text.trim()) throw new Error("第 " + (i + 1) + " 段的原文是空的");
    const e = planProblems(p.plan, ctx);
    if (e.length) throw new Error("第 " + (i + 1) + " 段的流程有問題：" + e[0]);
  });
  const F = S.F;
  const nums = S.tasks.map((t) => parseInt(String(t.code).split("-").pop(), 10) || 0);
  let n = nums.length ? Math.max(...nums) : 0;
  const total = sg.parts.length, now = Date.now();
  const batch = F.writeBatch(S.db);
  let firstId = "";
  sg.parts.forEach((p, i) => {
    n++;
    const code = S.me.groupId + "-" + p2(n);
    const tref = F.doc(col("tasks"));
    if (!firstId) firstId = tref.id;
    const plan = p.plan.map((s, j) => ({ id: "s" + (j + 1), kind: s.kind, anonId: s.anonId, startedAt: j === 0 ? now : null }));
    const title = sg.title + (total > 1 ? "（第 " + (i + 1) + "/" + total + " 段）" : "");
    batch.set(tref, {
      sessionId: S.sid, groupId: S.me.groupId, lang: S.me.lang, bankId: sg.bankId, bankTitle: sg.title, title, segIdx: i + 1, segTotal: total,
      sourceText: p.text.trim(), code, status: "active", stepIdx: 0, plan, initialPlan: stripPlan(p.plan), stepSeq: plan.length,
      vCount: 0, reworkCount: 0, createdBy: S.me.anonId, createdAt: F.serverTimestamp(), updatedAt: F.serverTimestamp(), clientTime: now
    });
    batch.set(F.doc(col("events")), evBase({ id: tref.id, code }, "dispatch", { role: "PM", toAnon: plan[0].anonId, detail: title + "｜" + planSummary(p.plan) }));
  });
  await batch.commit();
  S.seg = null; S.pmPick = "";
  S.taskId = null;
  S.pendingPick = firstId;
}

function planEditor(pfx, plan, o) {
  o = o || {};
  const from = o.from || 0;
  const R = rolesIn(), pm = pmAnon();
  const authors = new Set(authorsOf(plan));
  const errs = planProblems(plan, planCtx(from));
  const optsFor = (kind, cur) => {
    const list = kind === "review" ? R.reviewers : R.translators;
    return [h("option", { value: "" }, "請選人…")].concat(list.map((a) => {
      const bad = kind === "review" && authors.has(a) && a !== cur;
      return h("option", { value: a, disabled: bad }, nameOf(a) + (bad ? "（翻過這段，不能審）" : ""));
    }));
  };
  const rows = plan.map((s, i) => {
    const locked = i < from;
    const last = i === plan.length - 1;
    const movable = !locked && !last;
    const kindCell = (locked || last)
      ? h("span", { class: "pk" }, STEP_KINDS[s.kind].label)
      : h("select", { id: pfx + "-k" + i, value: s.kind, onchange: (e) => { s.kind = e.target.value; s.anonId = s.kind === "pmcheck" ? pm : ""; rr(); } },
        ["translate", "review", "revise", "pmcheck"].map((k) => h("option", { value: k }, STEP_KINDS[k].label)));
    const who = locked ? h("span", null, nameOf(s.anonId) + (s.done ? "　✓ 已完成" : ""))
      : (s.kind === "final" || s.kind === "pmcheck") ? h("span", null, nameOf(pm) + "（PM）")
        : h("select", { id: pfx + "-p" + i, value: s.anonId || "", onchange: (e) => { s.anonId = e.target.value; rr(); } }, optsFor(s.kind, s.anonId));
    return h("div", { class: "prow" + (locked ? " locked" : "") },
      h("span", { class: "pno" }, String(i + 1)), kindCell, who,
      movable ? h("div", { class: "btns" },
        h("button", { class: "plain sm", id: pfx + "-up" + i, disabled: i - 1 < from, onclick: () => { plan.splice(i - 1, 0, plan.splice(i, 1)[0]); rr(); } }, "↑"),
        h("button", { class: "plain sm", id: pfx + "-dn" + i, disabled: i + 1 >= plan.length - 1, onclick: () => { plan.splice(i + 1, 0, plan.splice(i, 1)[0]); rr(); } }, "↓"),
        h("button", { class: "danger sm", id: pfx + "-rm" + i, onclick: () => { plan.splice(i, 1); rr(); } }, "刪除")) : null);
  });
  const add = (kind) => { plan.splice(plan.length - 1, 0, { kind, anonId: kind === "pmcheck" ? pm : "" }); rr(); };
  const el = h("div", { class: "pe" }, rows,
    h("div", { class: "btns" },
      h("button", { class: "ghost sm", id: pfx + "-addt", onclick: () => add("translate") }, "＋ 翻譯"),
      h("button", { class: "ghost sm", id: pfx + "-addr", onclick: () => add("review") }, "＋ 審校"),
      h("button", { class: "ghost sm", id: pfx + "-addv", onclick: () => add("revise") }, "＋ 修改"),
      h("button", { class: "ghost sm", id: pfx + "-addp", onclick: () => add("pmcheck") }, "＋ PM 檢查")),
    h("div", { class: "hint" }, "用 ↑ ↓ 調整順序，步驟數量不限。只有最後的「最終檢查（PM）」固定在最後，因為它完成後這一段就結束了。"),
    plan[0] && plan[0].kind !== "translate" ? h("div", { class: "hint" }, "提醒：第一步不是翻譯，第一位拿到的會是空白譯文。") : null,
    errs.length ? h("div", { class: "perr" }, errs.map((x) => h("div", null, "⚠ " + x))) : null,
    !errs.length && !plan.some((x) => x.kind === "review") ? h("div", { class: "hint" }, "提醒：這個流程沒有審校步驟。") : null);
  return { el, errs };
}

/* 預設用簡單版：只選「誰翻譯、誰審校」，以及審校後要不要讓譯者修改一次。需要更多步驟再按「自訂步驟」。 */
const isSimplePlan = (plan) => {
  const k = plan.map((x) => x.kind).join(",");
  return k === "translate,review,final" || k === "translate,review,revise,final";
};
function simpleOrFull(i, p) {
  if (p.adv || !isSimplePlan(p.plan)) {
    const pe = planEditor("sg" + i, p.plan, {});
    const el = h("div", { class: "pe" }, pe.el, isSimplePlan(p.plan) ? h("div", { class: "btns" }, h("button", { class: "plain sm", onclick: () => { p.adv = false; rr(); } }, "回到簡單設定")) : null);
    return { el, errs: pe.errs };
  }
  const R = rolesIn();
  const tr = p.plan[0], rv = p.plan[1];
  const hasRev = p.plan.length === 4;
  const errs = planProblems(p.plan, planCtx(0));
  const opt = (list, bad) => [h("option", { value: "" }, "請選人…")].concat(list.map((a) => h("option", { value: a, disabled: bad(a) }, nameOf(a) + (bad(a) ? "（翻過這段，不能審）" : ""))));
  const setTr = (a) => { tr.anonId = a; if (hasRev) p.plan[2].anonId = a; rr(); };
  const setRev = (on) => {
    if (on && !hasRev) p.plan.splice(2, 0, { kind: "revise", anonId: tr.anonId });
    if (!on && hasRev) p.plan.splice(2, 1);
    rr();
  };
  const el = h("div", { class: "pe" },
    h("div", { class: "grid" },
      h("div", { class: "fld" }, h("label", { for: "sg" + i + "-tr" }, "誰翻譯"), h("select", { id: "sg" + i + "-tr", value: tr.anonId || "", onchange: (e) => setTr(e.target.value) }, opt(R.translators, () => false))),
      h("div", { class: "fld" }, h("label", { for: "sg" + i + "-rv" }, "誰審校"), h("select", { id: "sg" + i + "-rv", value: rv.anonId || "", onchange: (e) => { rv.anonId = e.target.value; rr(); } }, opt(R.reviewers, (a) => a === tr.anonId)))),
    h("label", { class: "chk" }, h("input", { type: "checkbox", id: "sg" + i + "-rev", checked: hasRev, onchange: (e) => setRev(e.target.checked) }), "審校後，讓譯者再修改一次"),
    errs.length ? h("div", { class: "perr" }, errs.map((x) => h("div", null, "⚠ " + x))) : null,
    h("div", { class: "hint" }, "最後一步固定由 PM 檢查並繳交。"),
    h("div", { class: "btns" }, h("button", { class: "plain sm", id: "sg" + i + "-adv", onclick: () => { p.adv = true; rr(); } }, "自訂步驟")));
  return { el, errs };
}

/* ---------- 步驟完成 / 送回 / 調整流程（全部用交易，避免兩個人同時操作造成錯亂） ---------- */
async function completeStep(t, ret) {
  const F = S.F, text = S.dr.text.trim(), comment = ((S.dr.comments || {}).note || "").trim();
  if (!text) throw new Error("譯文不能是空的");
  if (ret && !comment) throw new Error("送回時，請寫下要對方修改的意見");
  await saveDraftNow();
  const match = aiMatchFor(text);
  await F.runTransaction(S.db, async (tx) => {
    const tref = dref("tasks", t.id);
    const snap = await tx.get(tref);
    if (!snap.exists()) throw new Error("找不到這個任務");
    const cur = snap.data();
    const idx = cur.stepIdx || 0;
    const plan = (cur.plan || []).map((x) => Object.assign({}, x));
    const st = plan[idx];
    if (cur.status !== "active" || !st || st.anonId !== S.me.anonId) throw new Error("目前不能提交：輪到的人或任務狀態已經改變。請重新整理頁面。");
    if (st.kind === "review" && authorsOf(plan).includes(S.me.anonId)) throw new Error("你翻譯或修改過這一段，不能審校自己的譯文。請調整流程。");
    if (ret && st.kind !== "review" && st.kind !== "final" && st.kind !== "pmcheck") throw new Error("這一步不能送回");
    const now = Date.now();
    const vNo = (cur.vCount || 0) + 1, label = "v" + vNo;
    tx.set(F.doc(F.collection(S.db, "tasks", t.id, "versions")), {
      taskId: t.id, taskCode: cur.code, lang: cur.lang || S.me.lang, sessionId: S.sid, groupId: S.me.groupId, anonId: S.me.anonId,
      indTaskId: cur.code + "-" + S.me.anonId, role: STEP_KINDS[st.kind].role, kind: st.kind, stepId: st.id, stepIdx: idx, vNo, vLabel: label,
      round: (cur.reworkCount || 0) + 1, content: text, chars: text.length, comment, returned: !!ret, aiMatch: match,
      startedAt: st.startedAt || null, openedAt: S.dr.openedAt || null, at: F.serverTimestamp(), clientTime: now
    });
    plan[idx] = Object.assign(st, { done: true, doneAt: now, vLabel: label });
    const upd = { vCount: vNo, updatedAt: F.serverTimestamp() };
    let type = "submit", toAnon = "";
    if (ret) {
      let seq = cur.stepSeq || plan.length;
      plan.splice(idx + 1, 0,
        { id: "s" + (++seq), kind: ret.kind, anonId: ret.anonId, startedAt: now },
        { id: "s" + (++seq), kind: st.kind, anonId: st.anonId, startedAt: null });
      // 這一次送回已經安排了「修改 → 再審」，所以原本緊接在後面、同一個人的「修改」步驟不用再做一次
      const after = plan[idx + 3];
      if (after && after.kind === "revise" && after.anonId === ret.anonId && !after.done) plan.splice(idx + 3, 1);
      Object.assign(upd, { stepIdx: idx + 1, stepSeq: seq, reworkCount: (cur.reworkCount || 0) + 1 });
      type = "return"; toAnon = ret.anonId;
    } else if (st.kind === "final") {
      Object.assign(upd, { status: "done", finalText: text, confirmedAt: F.serverTimestamp() });
      type = "pm_confirm";
    } else {
      plan[idx + 1].startedAt = now;
      upd.stepIdx = idx + 1; toAnon = plan[idx + 1].anonId;
    }
    upd.plan = plan;
    tx.set(F.doc(col("events")), evBase({ id: t.id, code: cur.code }, type, { role: STEP_KINDS[st.kind].role, kind: st.kind, stepIdx: idx, vLabel: label, toAnon, detail: comment }));
    tx.update(tref, upd);
  });
  S.retTarget = "";
}

async function savePlanEdit(t, tail) {
  const F = S.F;
  await F.runTransaction(S.db, async (tx) => {
    const tref = dref("tasks", t.id);
    const snap = await tx.get(tref);
    const cur = snap.data();
    if (!cur || cur.status !== "active") throw new Error("這個任務已經完成，不能再調整流程");
    const idx = cur.stepIdx || 0, now = Date.now();
    const done = (cur.plan || []).slice(0, idx);
    let seq = cur.stepSeq || cur.plan.length;
    const curStepOld = cur.plan[idx];
    const merged = tail.map((s, j) => {
      const keep = s.id && cur.plan.find((x) => x.id === s.id);
      const o = { id: s.id || "s" + (++seq), kind: s.kind, anonId: s.anonId, startedAt: keep ? (keep.startedAt || null) : null };
      if (j === 0 && (!keep || keep.anonId !== curStepOld.anonId)) o.startedAt = now;
      else if (j === 0 && !o.startedAt) o.startedAt = now;
      return o;
    });
    const plan = done.concat(merged);
    const errs = planProblems(plan, planCtx(idx));
    if (errs.length) throw new Error(errs[0]);
    tx.set(F.doc(col("events")), evBase({ id: t.id, code: cur.code }, "plan_edit", { role: S.me.roleLabel || "", detail: "原：" + planSummary(cur.plan.slice(idx)) + "｜新：" + planSummary(merged) }));
    tx.update(tref, { plan, stepSeq: seq, updatedAt: F.serverTimestamp() });
  });
  S.pe = null;
}

async function submitReflection() {
  const answers = REFLECTION_PROMPTS.map((q, i) => ({ q, a: (S.rf.answers[i] || "").trim() }));
  if (answers.some((x) => !x.a)) throw new Error("每一題都要回答");
  const F = S.F;
  const data = {
    sessionId: S.sid, groupId: S.me.groupId, anonId: S.me.anonId, role: S.me.roleLabel, answers,
    submittedAt: F.serverTimestamp(), clientTime: Date.now()
  };
  await F.setDoc(dref("reflections", rosterId(S.sid, S.email)), data);
  await F.addDoc(col("events"), {
    type: "reflection", taskId: "", taskCode: "", sessionId: S.sid, groupId: S.me.groupId, anonId: S.me.anonId,
    indTaskId: "", role: S.me.roleLabel, at: F.serverTimestamp(), clientTime: Date.now()
  });
  S.reflection = Object.assign({}, data, { submittedAt: null });
  S.showRefl = false;
}

/* ---------- 插入（AI 內容 / 術語） ---------- */
function insertText(txt, type, extra) {
  const t = curTask();
  const mode = editMode(t);
  if (!mode) return;
  const cur = S.dr.text;
  let s = cur.length;
  if (S.caret && S.caret.taskId === t.id) s = Math.min(S.caret.s, cur.length);
  S.dr.text = cur.slice(0, s) + txt + cur.slice(s);
  S.caret = { taskId: t.id, s: s + txt.length, e: s + txt.length };
  scheduleSave();
  logEvent(t, type, extra).catch((e) => console.error(e));
  rr();
  setTimeout(() => {
    const el = document.getElementById("editor");
    if (el) { el.focus(); try { el.setSelectionRange(S.caret.s, S.caret.e); } catch (e) {} }
  }, 40);
}

async function addGroupTerm(src, tgt) {
  src = String(src || "").trim(); tgt = String(tgt || "").trim();
  if (!src || !tgt) throw new Error("中文與" + LANGS[S.me.lang].name + "都要填");
  if (!canGloss()) throw new Error("只有 PM 和 Reviewer 可以編輯本組術語表");
  const F = S.F;
  const batch = F.writeBatch(S.db);
  batch.set(F.doc(col("groupGlossary")), { sessionId: S.sid, groupId: S.me.groupId, lang: S.me.lang, anonId: S.me.anonId, src, tgt, createdAt: F.serverTimestamp(), clientTime: Date.now() });
  batch.set(F.doc(col("events")), evBase(NOTASK, "glossary_add", { detail: src + " → " + tgt }));
  await batch.commit();
}
async function editGroupTerm(g, tgt) {
  tgt = String(tgt || "").trim();
  if (!tgt) throw new Error("譯文不能是空的");
  if (!canGloss()) throw new Error("只有 PM 和 Reviewer 可以編輯本組術語表");
  if (tgt === g.tgt) { S.gedit = null; return; }
  const F = S.F;
  const batch = F.writeBatch(S.db);
  batch.update(dref("groupGlossary", g.id), { tgt, editedBy: S.me.anonId, editedAt: F.serverTimestamp(), editCount: (g.editCount || 0) + 1 });
  batch.set(F.doc(col("events")), evBase(NOTASK, "glossary_edit", Object.assign({ detail: g.src + "：" + g.tgt + " → " + tgt }, seedExtra(g))));
  await batch.commit();
  S.gedit = null;
}
async function deleteGroupTerm(g) {
  if (!canGloss()) throw new Error("只有 PM 和 Reviewer 可以編輯本組術語表");
  const F = S.F;
  const batch = F.writeBatch(S.db);
  batch.delete(dref("groupGlossary", g.id));
  batch.set(F.doc(col("events")), evBase(NOTASK, "glossary_delete", Object.assign({ detail: g.src + " → " + g.tgt }, seedExtra(g))));
  await batch.commit();
}
async function importGroupTerms(text) {
  const rows = parseCsv(text).filter((r) => r[0] && r[1] && !/^(zh|chinese|中文|原文)$/i.test(String(r[0]).trim()));
  if (!rows.length) throw new Error("沒有可匯入的列（兩欄：中文、" + LANGS[S.me.lang].name + "）");
  const have = new Set(S.glossary.map((g) => String(g.src).trim()));
  let n = 0;
  for (const r of rows) {
    const src = String(r[0]).trim();
    if (have.has(src)) continue;
    await addGroupTerm(src, r[1]);
    have.add(src);
    n++;
  }
  return n;
}

async function loadTeacher() {
  const T = S.T, F = S.F;
  const rows = async (q) => (await F.getDocs(q)).docs.map((d) => ({ id: d.id, ...d.data() }));
  const ss = await F.getDoc(dref("settings", "app"));
  S.settings = ss.exists() ? ss.data() : null;
  T.sessions = (await rows(col("sessions"))).sort(byTime);
  if (!T.viewSid || !T.sessions.find((s) => s.id === T.viewSid)) T.viewSid = (S.settings && S.settings.activeSessionId) || (T.sessions[0] && T.sessions[0].id) || "";
  T.anon = {};
  (await rows(col("anonmap"))).forEach((x) => { T.anon[x.id] = x.anonId; });
  if (T.viewSid) {
    const sid = F.where("sessionId", "==", T.viewSid);
    T.roster = (await rows(F.query(col("roster"), sid))).sort((a, b) => (a.groupId + (a.name || a.email)).localeCompare(b.groupId + (b.name || b.email), "zh"));
    T.seeds = (await rows(F.query(col("seedTerms"), sid))).sort((a, b) => (a.lang + a.src).localeCompare(b.lang + b.src, "zh"));
    T.groupRoles = await rows(F.query(col("groupRoles"), sid));
    T.bank = (await rows(F.query(col("bank"), sid))).sort(byTime);
    T.reflections = await rows(F.query(col("reflections"), sid));
    T.gloss = (await rows(F.query(col("groupGlossary"), sid))).sort((a, b) => (a.groupId + a.src).localeCompare(b.groupId + b.src, "zh"));
  } else { T.roster = []; T.bank = []; T.reflections = []; T.seeds = []; T.groupRoles = []; }
}

/* ---------- 名單 ---------- */
async function ensureAnon(email) {
  const T = S.T;
  if (T.anon[email]) return T.anon[email];
  const used = new Set(Object.values(T.anon));
  let id;
  const span = used.size < 700 ? [100, 900] : [1000, 9000];
  do { id = "A-" + (Math.floor(Math.random() * span[1]) + span[0]); } while (used.has(id));
  await S.F.setDoc(dref("anonmap", email), { email, anonId: id, createdAt: S.F.serverTimestamp() });
  T.anon[email] = id;
  return id;
}
async function addRoster(email, name, groupId, lang, pm) {
  const T = S.T;
  email = String(email || "").trim().toLowerCase();
  groupId = String(groupId || "").trim();
  name = String(name || "").trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error("Email 格式不正確：" + email);
  if (!groupId) throw new Error("請填組別（例如 G01）：" + email);
  if (!T.viewSid) throw new Error("請先建立場次");
  lang = normLang(lang);
  if (!lang) { const mate = T.roster.find((r) => r.groupId === groupId && normLang(r.lang)); lang = mate ? normLang(mate.lang) : "en"; }
  const anonId = await ensureAnon(email);
  await S.F.setDoc(dref("roster", rosterId(T.viewSid, email)), { sessionId: T.viewSid, email, name, groupId, pm: !!pm, lang, anonId, createdAt: S.F.serverTimestamp() });
}
async function importRoster() {
  const rows = parseCsv(S.T.imp);
  if (!rows.length) throw new Error("請先貼上名單（欄位：email、姓名、組別、目標語言、PM）");
  if (!String(rows[0][0] || "").includes("@")) rows.shift();
  const errs = [];
  let ok = 0;
  for (const r of rows) {
    try {
      if (r[3] && !normLang(r[3])) throw new Error("語言看不懂：" + r[3] + "（請寫 英文、日文、德文）");
      await addRoster(r[0], r[1], r[2], r[3], isPmCell(r[4]));
      ok++;
    } catch (e) { errs.push((r[0] || "（空白）") + "：" + e.message); }
  }
  S.T.imp = "";
  await loadTeacher();
  if (errs.length) toast("匯入 " + ok + " 筆，" + errs.length + " 筆失敗：\n" + errs.slice(0, 5).join("\n"), "bad");
  else toast("已匯入 " + ok + " 筆", "ok");
}
function groupChecks() {
  const m = {};
  S.T.roster.forEach((r) => { (m[r.groupId] = m[r.groupId] || []).push(r); });
  return Object.keys(m).sort().map((g) => {
    const rs = m[g], problems = [];
    const langs = new Set(rs.map((r) => normLang(r.lang) || "en"));
    if (langs.size > 1) problems.push("成員的目標語言不一致");
    const pms = rs.filter((r) => r.pm).length;
    if (pms === 0) problems.push("還沒有指定 PM");
    if (pms > 1) problems.push("PM 有 " + pms + " 人（只能 1 人）");
    const gr = S.T.groupRoles.find((x) => x.groupId === g);
    return { g, problems, n: rs.length, lang: langs.size === 1 ? LANGS[[...langs][0]].short : "",
      roles: gr ? "PM 已指定角色：Translator " + (gr.translators || []).length + " 人、Reviewer " + (gr.reviewers || []).length + " 人" : "PM 尚未指定角色" };
  });
}

async function importSeeds() {
  const T = S.T;
  const rows = parseCsv(T.simp).filter((r) => r[0] && r[1] && !/^(zh|中文|原文)$/i.test(r[0]));

async function distributeSeeds() {

function fmtDur(ms) {
  if (ms == null || isNaN(ms)) return "";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + " 秒";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " 分 " + (s % 60) + " 秒";
  return Math.floor(m / 60) + " 小時 " + (m % 60) + " 分";
}

/* 流程比對：把「PM 派發時排的流程」和「實際發生的順序」逐步對照 */
const execEvents = (ev) => ev.filter((e) => e.type === "submit" || e.type === "return" || e.type === "pm_confirm");
function analyzeFlow(task, allEvents) {
  const ev = allEvents.filter((e) => e.taskId === task.id).sort(byTime);
  const steps = [];
  const push = (step, detail, kind, flag) => steps.push({ step, detail, kind, flag });
  const label = (k) => (STEP_KINDS[k] ? STEP_KINDS[k].label : k);
  const disp = ev.find((e) => e.type === "dispatch");
  push("0 派發", disp ? "PM（" + disp.anonId + "）派發，" + fmtFull(recMs(disp)) : "找不到派發紀錄", disp && ev[0] === disp ? "ok" : "warn", disp && ev[0] === disp ? "符合" : "需人工確認");
  const ex = execEvents(ev);
  const used = new Set();
  let prevMs = disp ? recMs(disp) : 0;
  (task.initialPlan || []).forEach((p, j) => {
    const k = ex.findIndex((e, i) => !used.has(i) && e.kind === p.kind && e.anonId === p.anonId);
    const name = (j + 1) + " " + label(p.kind) + "（預定：" + p.anonId + "）";
    if (k >= 0) {
      used.add(k);
      const e = ex[k];
      push(name, e.anonId + " 完成 " + (e.vLabel || "") + "，" + fmtFull(recMs(e)) + (prevMs ? "，距上一步 " + fmtDur(recMs(e) - prevMs) : ""), "ok", "符合");
      prevMs = recMs(e);
    } else push(name, task.status === "done" ? "沒有找到對應的完成紀錄（實際做的人或順序和預定不同）" : "尚未輪到或進行中", task.status === "done" ? "warn" : "off", task.status === "done" ? "需人工確認" : "進行中");
  });
  const extra = ex.filter((e, i) => !used.has(i));
  const nRet = ev.filter((e) => e.type === "return").length;
  const nEdit = ev.filter((e) => e.type === "plan_edit").length;
  push("額外步驟", "送回 " + nRet + " 次、PM 調整流程 " + nEdit + " 次、未在預定流程內的完成紀錄 " + extra.length + " 筆", nRet + nEdit > 3 ? "warn" : "ok", nRet + nEdit > 3 ? "往返偏多" : (nRet + nEdit ? "有調整" : "符合"));
  const pc = ev.find((e) => e.type === "pm_confirm");
  if (pc) push("PM 繳交", pc.anonId + " 繳交，" + fmtFull(recMs(pc)) + (disp ? "；全程 " + fmtDur(recMs(pc) - recMs(disp)) : ""), "ok", "符合");
  else push("PM 繳交", "尚未完成", "off", "進行中");
  const anons = [...new Set(ev.filter((e) => e.type !== "dispatch").map((e) => e.anonId))].sort();
  push("補充：AI 與術語表使用", anons.map((a) => a + "：提問 " + ev.filter((e) => e.anonId === a && e.type === "ai_prompt").length + "、插入 AI " + ev.filter((e) => e.anonId === a && e.type === "ai_insert").length + "、插入術語 " + ev.filter((e) => e.anonId === a && e.type === "glossary_insert").length).join("；"), "", "僅供參考");
  return steps;
}

/* ---------- KPI 彙整（全部由系統已有的紀錄算出，不含主觀判斷） ---------- */
const r1 = (x) => (x == null || isNaN(x) ? "" : Math.round(x * 10) / 10);
function computeKpi(d) {
  const sname = sessionName(S.T.viewSid);
  const vBy = {};
  d.versions.forEach((v) => { (vBy[v.taskId] = vBy[v.taskId] || []).push(v); });
  const taskRows = d.tasks.map((t) => {
    const vs = (vBy[t.id] || []).sort(byTime);
    const evs = d.events.filter((e) => e.taskId === t.id);
    const start = t.clientTime || recMs(t);
    const end = t.status === "done" ? (tms(t.confirmedAt) || (vs.length ? recMs(vs[vs.length - 1]) : 0)) : 0;
    const stepsDone = (t.plan || []).filter((x) => x.done).length;
    return {
      session: sname, groupId: t.groupId, taskCode: t.code, lang: t.lang, status: t.status,
      sourceChars: (t.sourceText || "").length, finalChars: (t.finalText || "").length,
      stepsPlanned: (t.initialPlan || []).length, stepsDone, versions: vs.length,
      returns: t.reworkCount || 0, reworkRate: stepsDone ? r1((t.reworkCount || 0) / stepsDone * 100) : "",
      planEdits: evs.filter((e) => e.type === "plan_edit").length, totalMin: end && start ? r1((end - start) / 60000) : ""
    };
  });
  const people = {};
  const P = (a, g) => (people[a] = people[a] || { session: sname, groupId: g, anonId: a, translate: 0, revise: 0, review: 0, final: 0, chars: 0, workMs: 0, turnMs: 0, pickMs: 0, pickN: 0, returns: 0, glossAdd: 0, glossEdit: 0, glossDel: 0, aiPrompts: 0, aiInserts: 0, glossInserts: 0 });
  d.versions.forEach((v) => {
    const p = P(v.anonId, v.groupId);
    p[v.kind] = (p[v.kind] || 0) + 1;
    p.chars += v.chars || (v.content || "").length;
    const end = v.clientTime || recMs(v);
    if (v.openedAt) p.workMs += Math.max(0, end - v.openedAt);
    if (v.startedAt) p.turnMs += Math.max(0, end - v.startedAt);
    if (v.startedAt && v.openedAt) { p.pickMs += Math.max(0, v.openedAt - v.startedAt); p.pickN++; }
  });
  d.events.forEach((e) => {
    if (!e.anonId || e.type === "reflection") return;
    const p = P(e.anonId, e.groupId);
    if (e.type === "return") p.returns++;
    if (e.type === "glossary_add") p.glossAdd++;
    if (e.type === "glossary_edit") p.glossEdit++;
    if (e.type === "glossary_delete") p.glossDel++;
    if (e.type === "ai_insert") p.aiInserts++;
    if (e.type === "glossary_insert") p.glossInserts++;
  });
  d.ai.forEach((l) => { P(l.anonId, l.groupId).aiPrompts++; });
  const personRows = Object.values(people).map((p) => {
    const hrs = p.workMs / 3600000;
    return {
      session: p.session, groupId: p.groupId, anonId: p.anonId, translateSteps: p.translate, reviseSteps: p.revise, reviewSteps: p.review, finalSteps: p.final,
      versions: p.translate + p.revise + p.review + p.final, charsHandled: p.chars, workMin: r1(p.workMs / 60000), turnaroundMin: r1(p.turnMs / 60000),
      charsPerHour: hrs > 0 ? Math.round(p.chars / hrs) : "", avgPickupMin: p.pickN ? r1(p.pickMs / p.pickN / 60000) : "",
      returnsIssued: p.returns, glossaryAdded: p.glossAdd, glossaryEdited: p.glossEdit, glossaryDeleted: p.glossDel,
      aiPrompts: p.aiPrompts, aiInserts: p.aiInserts, glossaryInserts: p.glossInserts
    };
  }).sort((a, b) => (a.groupId + a.anonId).localeCompare(b.groupId + b.anonId));
  const groups = [...new Set(d.tasks.map((t) => t.groupId))].sort();
  const groupRows = groups.map((g) => {
    const ts = taskRows.filter((x) => x.groupId === g);
    const done = ts.filter((x) => x.status === "done");
    const sum = (k) => ts.reduce((a, x) => a + (+x[k] || 0), 0);
    const steps = sum("stepsDone");
    return {
      session: sname, groupId: g, tasks: ts.length, tasksDone: done.length, versions: sum("versions"), returns: sum("returns"),
      reworkRate: steps ? r1(sum("returns") / steps * 100) : "", planEdits: sum("planEdits"),
      avgTotalMin: done.length ? r1(done.reduce((a, x) => a + (+x.totalMin || 0), 0) / done.length) : "",
      glossaryTerms: d.gloss.filter((x) => x.groupId === g).length,
      glossaryAddedByStudents: d.events.filter((e) => e.groupId === g && e.type === "glossary_add").length
    };
  });
  return { taskRows, personRows, groupRows };
}

function dataRows(set) {
  const T = S.T, d = T.data;
  if (!d) return [];
  const sname = sessionName(T.viewSid);
  const ts = (r) => { const m = recMs(r); return m ? new Date(m).toISOString() : ""; };
  const base = (r) => Object.assign({}, flatten(r), { session: sname, timestamp: ts(r) });
  if (set === "events") return d.events.map(base);
  if (set === "versions") return d.versions.map(base);
  if (set === "aiLogs") return d.ai.map(base);
  if (set === "reflections") return d.refl.map((r) => Object.assign(base(r), { answers: JSON.stringify(r.answers || []) }));
  if (set === "groupGlossary") return (d.gloss || []).map(base);
  if (set === "tasks") return d.tasks.map((t) => { const x = base(t); delete x.sourceText; delete x.finalText; x.plan = (t.plan || []).map((p) => p.kind + ":" + p.anonId).join(" > "); x.initialPlan = (t.initialPlan || []).map((p) => p.kind + ":" + p.anonId).join(" > "); return Object.assign(x, { sourceChars: (t.sourceText || "").length, finalChars: (t.finalText || "").length }); });
  if (set === "flow") {
    const out = [];
    d.tasks.forEach((t) => analyzeFlow(t, d.events).forEach((s) => out.push({ session: sname, groupId: t.groupId, taskCode: t.code, step: s.step, flag: s.flag, detail: s.detail })));
    return out;
  }
  if (set === "kpiPerson") return computeKpi(d).personRows;
  if (set === "kpiTask") return computeKpi(d).taskRows;
  if (set === "kpiGroup") return computeKpi(d).groupRows;
  if (set === "seedTerms") return seedStatus(d);
  return [];
}
