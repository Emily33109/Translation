<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻譯實作儀表板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --line:#D9DDD8; --ink:#1B2320; --mute:#5B6661;
  --accent:#0E6B62; --accent-ink:#0A4F48; --ok-bg:#E2F0EE; --ok-line:#A9CFCA;
  --warn-bg:#FBEFD5; --warn-line:#E3C98A; --warn-ink:#6B4600;
  --bad-bg:#F6DADA; --bad-ink:#6E1F1F; --bad-line:#E2A9A9; --off-bg:#ECEEEB; --off-ink:#3F4A45;
  --ins-bg:#D8EEDF; --ins-ink:#144D2A; --del-bg:#F6DADA; --del-ink:#6E1F1F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 'Noto Sans TC',system-ui,-apple-system,'Microsoft JhengHei',sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:24px 20px 72px;display:flex;flex-direction:column;gap:20px}
.narrow{max-width:760px;margin:0 auto;padding:40px 16px 72px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px;line-height:1.3}
h2{margin:0;font-size:18px;line-height:1.4}
h3{margin:0;font-size:16px;line-height:1.4}
p{margin:0}
.sub{color:var(--mute);font-size:14px;line-height:1.7}
.mono{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;color:var(--mute);word-break:break-word}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#3D2A00}
.card.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top .l{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.chip.t{font-family:'Noto Sans TC',sans-serif}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:700 15px 'Noto Sans TC',sans-serif;cursor:pointer}
button.ghost{background:#fff;color:var(--accent-ink);border:1px solid var(--accent)}
button.plain{background:#fff;color:var(--ink);border:1px solid #B9C0BB;font-weight:500}
button.danger{background:#fff;color:var(--bad-ink);border:1px solid var(--bad-line)}
button.sm{min-height:36px;padding:0 12px;font-size:14px}
button:disabled{background:#C9CFCB;color:#4A5450;border-color:#C9CFCB;cursor:not-allowed}
button.ghost:disabled,button.plain:disabled,button.danger:disabled{background:#F3F4F1}
label{font-size:14px;color:var(--mute)}
input[type=text],input[type=email],select,textarea{width:100%;font:400 16px/1.7 'Noto Sans TC',sans-serif;color:var(--ink);padding:8px 12px;border:1px solid #B9C0BB;border-radius:8px;background:#fff}
select{min-height:44px;padding:0 12px}
input[type=text],input[type=email]{min-height:44px}
textarea{resize:vertical;min-height:120px}
textarea.editor{min-height:200px}
textarea:read-only{background:#F3F4F1}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;color:var(--ink)}
.chk input{width:18px;height:18px;margin:0}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;background:var(--off-bg);color:var(--off-ink);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--accent-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink)}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:20px}
.side{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:20px}
.tasks{display:flex;flex-wrap:wrap;gap:8px}
.taskbtn{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid #B9C0BB;border-radius:8px;background:#fff;color:var(--ink);font:500 14px 'Noto Sans TC',sans-serif;cursor:pointer}
.taskbtn.on{border-color:var(--ink);background:var(--ink);color:#fff}
.stepper{display:flex;flex-wrap:wrap;gap:14px}
.step{flex:1 1 140px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.dot{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono',monospace;border:2px solid #B9C0BB;color:var(--mute);background:#fff}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step.cur .dot{border-color:var(--accent);color:var(--accent)}
.step b{font-size:15px}
.step small{display:block;color:var(--mute);font-size:13px;line-height:1.5}
.src{white-space:pre-wrap;background:#F3F4F1;border-radius:8px;padding:12px 14px;font-size:16px;line-height:1.8}
.out{white-space:pre-wrap;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:8px;padding:10px 12px;line-height:1.7}
.two{display:flex;flex-wrap:wrap;gap:16px}
.two>*{flex:1 1 300px;min-width:0}
.box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box .txt{white-space:pre-wrap;line-height:1.8}
.diff{white-space:pre-wrap;line-height:1.9;font-size:16px}
.diff ins{background:var(--ins-bg);color:var(--ins-ink);text-decoration:underline;padding:0 1px}
.diff del{background:var(--del-bg);color:var(--del-ink);text-decoration:line-through;padding:0 1px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{border-bottom:2px solid var(--ink);color:var(--mute);font-size:13px;white-space:nowrap}
td.m{font:500 12px 'IBM Plex Mono',monospace;white-space:nowrap}
td.cell{max-width:340px;white-space:pre-wrap;word-break:break-word}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row .l{display:flex;flex-direction:column;flex:1 1 240px;min-width:0}
.row .l small{color:var(--mute);font-size:13px;line-height:1.6}
.bar{height:14px;background:var(--off-bg);border-radius:7px;overflow:hidden}
.bar>div{height:14px;background:var(--accent);width:0%}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:0 16px;border:1px solid #B9C0BB;border-radius:8px;background:#fff;color:var(--ink);font:500 15px 'Noto Sans TC',sans-serif;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fields{display:flex;flex-wrap:wrap;gap:4px 18px}
.fields .chk{flex:0 1 220px}
.grid{display:flex;flex-wrap:wrap;gap:12px}
.grid>*{flex:1 1 200px;min-width:0}
.fld{display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad-ink)}
.toast.ok{background:var(--accent-ink)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.hint{font-size:13px;color:var(--mute);line-height:1.6}
.sr{position:absolute;left:-9999px}
@media (max-width:640px){ .wrap{padding:16px 12px 64px} .card{padding:16px} }
</style>
</head>
<body>
<div id="app"><div class="narrow"><div class="card"><p>載入中…</p></div></div></div>
<div id="toast" aria-live="polite"></div>
<noscript>這個頁面需要開啟 JavaScript。</noscript>
<script type="module">
/* =====================================================================
 *  翻譯實作儀表板（最終版）
 *  請只修改「設定區」。其他程式不需要動。

// ---------- 設定區（開始）----------

// 1) Firebase 專案設定：Firebase 主控台 → 專案設定 → 一般 → 您的應用程式 → SDK 設定

// 4) 研究參與同意書。標示 [由教師填寫] 的地方一定要換成正式內容，
//    否則學生無法按「同意」。更改內容後請把 CONSENT_VERSION 改成新版本（例如 v2），
//    所有學生就會重新同意一次。
const CONSENT_VERSION = "v1";
const CONSENT_TITLE = "研究參與同意書";
const CONSENT_SECTIONS = [
  { h: "研究目的", p: "[由教師填寫]" },
  { h: "會收集的資料", p: "任務的派發與交接時間、各次提交的版本與審校意見、你向離線 AI 提出的 prompt 與 AI 的回應、你把 AI 內容插入譯文的動作、術語表的使用，以及課後反思。本系統目前不記錄逐字鍵盤輸入。" },
  { h: "匿名處理", p: "研究資料只使用匿名編號，不會輸出你的姓名或電子郵件。姓名與匿名編號的對照只有教師可以查看。" },
  { h: "資料保存期限與存取權限", p: "[由教師填寫]" },
  { h: "自願參與與退出方式", p: "[由教師填寫]" },
  { h: "聯絡方式", p: "[由教師填寫]" }
];

// 5) 課後反思題目（可自行修改、增減）。
const REFLECTION_PROMPTS = [
  "這次翻譯過程中，你遇到最大的困難是什麼？你怎麼處理？",
  "你是怎麼使用離線 AI 的？哪些 AI 的內容你採用了、哪些沒有採用？為什麼？",
  "團隊交接與審校的過程中，你覺得哪個環節最有幫助或最有問題？"
];

// ---------- 設定區（結束）----------

const FIREBASE_VER = "10.14.1";
const FB_URLS = {
  app: `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-app.js`,
  auth: `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-auth.js`,
  fs: `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/firebase-firestore.js`
};
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.83/+esm";
const OPENCC_URL = "https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/esm/full.js";
const MODEL_F16 = "Qwen3-0.6B-q4f16_1-MLC";
const MODEL_F32 = "Qwen3-0.6B-q4f32_1-MLC";
const MODEL_CHOICES = [
  [MODEL_F16, "Qwen3 0.6B（q4f16，約需 1.4GB 顯示記憶體，預設）"],
  [MODEL_F32, "Qwen3 0.6B（q4f32，約需 1.9GB，沒有 shader-f16 時用）"],
  ["Qwen2.5-0.5B-Instruct-q4f16_1-MLC", "Qwen2.5 0.5B Instruct（q4f16，備選）"],
  ["Qwen3.5-0.8B-q4f16_1-MLC", "Qwen3.5 0.8B（q4f16，較大）"]
];
const PLACEHOLDER = "[由教師填寫]";

const ROLES = ["PM", "Translator 1", "Translator 2", "Reviewer"];
const TRANSLATORS = ["Translator 1", "Translator 2"];
const ROLE_SHORT = { "PM": "PM", "Translator 1": "T1", "Translator 2": "T2", "Reviewer": "R" };
const ROLE_DESC = {
  "PM": "派發任務、追蹤進度，並在審校完成後做最終檢查。只有 PM 可以下載最終譯文。",
  "Translator 1": "獨立翻譯整份原文，提交給 Reviewer；若被送回，依意見修改後再提交。",
  "Translator 2": "獨立翻譯整份原文，提交給 Reviewer；若被送回，依意見修改後再提交。",
  "Reviewer": "比對兩位 Translator 的譯文，整合成一份，再決定送回修改或交給 PM。"
};
const STATUS_LABEL = {
  translating: "翻譯中", review: "審校中", revising: "修改中", pm_check: "最終檢查", done: "已完成"
};
const EVENT_LABEL = {
  dispatch: "派發任務", submit: "提交譯文", review_return: "送回修改", review_complete: "完成審校",
  pm_return: "PM 退回審校", pm_confirm: "PM 最終確認", ai_prompt: "向 AI 提問",
  ai_insert: "插入 AI 內容", glossary_insert: "插入術語", reflection: "繳交反思"
};

/* ===================== 工具函式 ===================== */
const $ = (s, r = document) => r.querySelector(s);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let pendingValue;
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "value") pendingValue = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "checked" || k === "disabled" || k === "readOnly" || k === "selected" || k === "multiple") el[k] = !!v;
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  const add = (c) => {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(add); return; }
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  kids.forEach(add);
  if (pendingValue !== undefined) el.value = pendingValue;
  return el;
}

function toDate(x) {
  if (!x) return null;
  if (typeof x.toDate === "function") return x.toDate();
  if (x instanceof Date) return x;
  if (typeof x === "number") return new Date(x);
  return null;
}
const tms = (x) => { const d = toDate(x); return d ? d.getTime() : 0; };
const recMs = (r) => tms(r.at) || r.clientTime || tms(r.createdAt) || tms(r.updatedAt) || 0;
const byTime = (a, b) => recMs(a) - recMs(b);
const p2 = (n) => String(n).padStart(2, "0");
function fmtFull(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}
function fmtShort(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return `${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}

function toast(msg, kind) {
  const box = $("#toast");
  const el = h("div", { class: "toast " + (kind || "") }, msg);
  box.append(el);
  setTimeout(() => el.remove(), kind === "bad" ? 7000 : 3500);
}

function normRole(x) {
  const s = String(x || "").trim().toLowerCase().replace(/\s+/g, "");
  if (["pm", "專案經理", "經理"].includes(s)) return "PM";
  if (["t1", "translator1", "譯者1", "翻譯1", "翻譯者1"].includes(s)) return "Translator 1";
  if (["t2", "translator2", "譯者2", "翻譯2", "翻譯者2"].includes(s)) return "Translator 2";
  if (["r", "reviewer", "審校", "審稿", "審校者"].includes(s)) return "Reviewer";
  return null;
}

/* ---------- 文字差異（逐字） ---------- */
function diffSeq(A, B, limit) {
  let s = 0;
  while (s < A.length && s < B.length && A[s] === B[s]) s++;
  let ea = A.length, eb = B.length;
  while (ea > s && eb > s && A[ea - 1] === B[eb - 1]) { ea--; eb--; }
  const a = A.slice(s, ea), b = B.slice(s, eb);
  const n = a.length, m = b.length;
  if (limit && n * m > limit) return null;
  const ops = [];
  for (let i = 0; i < s; i++) ops.push(["eq", A[i]]);
  if (n === 0) { for (const x of b) ops.push(["ins", x]); }
  else if (m === 0) { for (const x of a) ops.push(["del", x]); }
  else {
    const w = m + 1;
    const dp = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i * w + j] = a[i] === b[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
      }
    }
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push(["eq", a[i]]); i++; j++; }
      else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) { ops.push(["del", a[i]]); i++; }
      else { ops.push(["ins", b[j]]); j++; }
    }
    while (i < n) ops.push(["del", a[i++]]);
    while (j < m) ops.push(["ins", b[j++]]);
  }
  for (let i = ea; i < A.length; i++) ops.push(["eq", A[i]]);
  return ops;
}
function diffText(a, b) {
  a = a || ""; b = b || "";
  let ops = diffSeq(Array.from(a), Array.from(b), 4000000);
  if (!ops) {
    const la = a.split("\n"), lb = b.split("\n");
    ops = diffSeq(la, lb, 0).map(([t, x]) => [t, x + "\n"]);
  }
  const out = [];
  for (const [t, x] of ops) {
    const last = out[out.length - 1];
    if (last && last.t === t) last.s += x; else out.push({ t, s: x });
  }
  return out;
}
function diffEl(a, b) {
  const parts = diffText(a, b);
  if (parts.length === 0) return h("span", { class: "diff" }, "（沒有內容）");
  if (parts.every((p) => p.t === "eq")) {
    return h("span", { class: "diff" }, parts.map((p) => p.s), h("div", { class: "hint" }, "兩個版本的文字完全相同。"));
  }
  return h("span", { class: "diff" }, parts.map((p) => p.t === "eq" ? p.s : h(p.t === "del" ? "del" : "ins", null, p.s)));
}

/* ---------- AI 內容與最終文字的相似度（字元 bigram） ---------- */
function bigrams(s) {
  s = String(s || "").replace(/\s+/g, "");
  const m = new Map();
  for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); }
  return m;
}
function overlapScores(aiText, finalText) {
  const A = bigrams(aiText), B = bigrams(finalText);
  let inter = 0, na = 0, nb = 0;
  A.forEach((v, k) => { na += v; if (B.has(k)) inter += Math.min(v, B.get(k)); });
  B.forEach((v) => { nb += v; });
  return {
    dice: na + nb === 0 ? 0 : (2 * inter) / (na + nb),
    contained: na === 0 ? 0 : inter / na
  };
}

/* ---------- CSV / 下載 ---------- */
function toCsv(rows, fields) {
  const esc = (v) => {
    if (v === null || v === undefined) return "";
    if (typeof v === "object") v = JSON.stringify(v);
    v = String(v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  return "﻿" + [fields.join(",")].concat(rows.map((r) => fields.map((f) => esc(r[f])).join(","))).join("\r\n");
}
function parseCsv(text) {
  text = String(text || "").replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const delim = first.includes("\t") ? "\t" : ",";
  const rows = [];
  let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.some((x) => x.trim() !== "")) rows.push(row);
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.some((x) => x.trim() !== "")) rows.push(row);
  return rows.map((r) => r.map((x) => x.trim()));
}
function download(name, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function flatten(rec) {
  const o = {};
  for (const [k, v] of Object.entries(rec)) {
    if (v && typeof v.toDate === "function") o[k] = v.toDate().toISOString();
    else if (v && typeof v === "object") o[k] = JSON.parse(JSON.stringify(v, (kk, vv) => (vv && typeof vv.toDate === "function" ? vv.toDate().toISOString() : vv)));
    else o[k] = v;
  }
  return o;
}
function cleanThink(t) {
  return String(t || "").replace(/<think>[\s\S]*?<\/think>/g, "").replace(/<think>[\s\S]*$/, "").trim();
}
function randId(n) {
  const c = "abcdefghijklmnopqrstuvwxyz0123456789";
  let s = "";
  const a = new Uint32Array(n);
  crypto.getRandomValues(a);
  for (let i = 0; i < n; i++) s += c[a[i] % c.length];
  return s;
}

function friendly(e) {
  const c = (e && e.code) || "";
  if (c === "permission-denied" || /insufficient permissions/i.test(e && e.message || "")) return "沒有權限執行這個動作。請確認你在教師名單裡，或請老師檢查 Firestore 安全規則。";
  if (c === "unavailable" || c === "auth/network-request-failed") return "無法連線到 Firebase，請確認網路後再試。";
  if (c === "auth/unauthorized-domain") return "這個網址尚未加入 Firebase 的「授權網域」，請管理員到 Authentication → 設定 → 授權網域加入。";
  if (c === "auth/operation-not-allowed") return "Firebase 尚未啟用 Google 登入，請管理員到 Authentication → Sign-in method 啟用。";
  if (c === "failed-precondition") return "資料庫查詢需要建立索引，或資料庫尚未建立。請管理員查看瀏覽器主控台的訊息。";
  return (e && e.message) ? String(e.message) : "發生未知的錯誤";
}
function showError(e) {
  console.error(e);
  S.view = "error";
  S.msg = friendly(e);
  rr();
}
async function act(fn, okMsg) {
  if (S.busy) return;
  S.busy = true;
  rr();
  try {
    const r = await fn();
    if (okMsg) toast(okMsg, "ok");
    return r;
  } catch (e) {
    console.error(e);
    toast(friendly(e), "bad");
  } finally {
    S.busy = false;
    rr();
  }
}

function cleanup() {
  S.unsubs.forEach((u) => { try { u(); } catch (e) {} });
  S.taskUnsubs.forEach((u) => { try { u(); } catch (e) {} });
  S.unsubs = []; S.taskUnsubs = [];
  Object.assign(S, {
    settings: null, sid: "", sessionName: "", consent: null, me: null, tasks: [], taskId: null,
    versions: [], events: [], myAi: [], bank: [], glossary: [], watched: null, reflection: null,
    rf: null, showRefl: false, dirty: false, agree: false, isTeacher: false, T: null

async function boot() {
  window.addEventListener("hashchange", () => location.reload());
  window.addEventListener("beforeunload", (e) => {
    const pendingRefl = S.view === "student" && S.tasks.some((t) => t.status === "done") && !S.reflection;
    if (pendingRefl || S.dirty) { e.preventDefault(); e.returnValue = ""; }
  });
  if (location.hash === "#prep") { S.view = "prep"; render(); prepInit(); return; }
  if (!isConfigured()) { S.view = "setup"; render(); return; }
  try {
    const [a, b, c] = await Promise.all([import(FB_URLS.app), import(FB_URLS.auth), import(FB_URLS.fs)]);
    S.F = Object.assign({}, a, b, c);
  } catch (e) {
    console.error(e);
    S.view = "error";
    S.msg = "無法載入 Firebase 程式庫。請確認這台電腦可以連到網路（www.gstatic.com）。";
    render();
    return;
  }
  try {
    const app = S.F.initializeApp(FIREBASE_CONFIG);
    S.auth = S.F.getAuth(app);
    S.db = S.F.getFirestore(app);
    S.F.onAuthStateChanged(S.auth, (u) => { handleAuth(u); });
  } catch (e) { showError(e); }
}

async function handleAuth(user) {
  cleanup();
  if (!user) { S.user = null; S.email = ""; S.view = "login"; rr(); return; }
  S.user = user;
  S.email = (user.email || "").toLowerCase();
  S.view = "loading";
  rr();
  try {
    S.isTeacher = TEACHER_EMAILS.map((x) => x.toLowerCase()).includes(S.email);
    const sSnap = await S.F.getDoc(dref("settings", "app"));
    S.settings = sSnap.exists() ? sSnap.data() : null;
    if (S.isTeacher) { await startTeacher(); return; }
    if (!S.settings || !S.settings.activeSessionId) { S.view = "nosession"; rr(); return; }
    S.sid = S.settings.activeSessionId;
    const sess = await S.F.getDoc(dref("sessions", S.sid));
    S.sessionName = sess.exists() ? (sess.data().name || "") : "";
    await enterStudent();
  } catch (e) { showError(e); }
}

async function enterStudent() {

function subscribeTasks() {
  const q = S.F.query(col("tasks"), S.F.where("sessionId", "==", S.sid), S.F.where("groupId", "==", S.me.groupId));
  S.unsubs.push(S.F.onSnapshot(q, (snap) => {
    S.tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(byTime);
    if (!S.taskId || !S.tasks.find((t) => t.id === S.taskId)) {
      S.taskId = S.tasks.length ? S.tasks[S.tasks.length - 1].id : null;

function watchTask() {
  if (S.watched === S.taskId) return;
  S.taskUnsubs.forEach((u) => { try { u(); } catch (e) {} });
  S.taskUnsubs = [];
  S.watched = S.taskId;
  S.versions = []; S.events = []; S.myAi = [];
  S.dr = { taskId: S.taskId, text: "", comments: {}, baseKey: "", saved: 0, loaded: false };
  S.targets = {}; S.cmpA = ""; S.cmpB = "";
  if (!S.taskId) return;
  const tid = S.taskId;
  S.taskUnsubs.push(S.F.onSnapshot(S.F.collection(S.db, "tasks", tid, "versions"), (snap) => {
    S.versions = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(byTime);
    rr();

  S.taskUnsubs.push(S.F.onSnapshot(
    S.F.query(col("events"), S.F.where("sessionId", "==", S.sid), S.F.where("groupId", "==", S.me.groupId), S.F.where("taskId", "==", tid)),
    (snap) => { S.events = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(byTime); rr(); },

  const keep = ae && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd, st: ae.scrollTop } : null;
  const sy = window.scrollY;
  let node;
  try {
    switch (S.view) {
      case "setup": node = viewSetup(); break;
      case "error": node = viewError(); break;
      case "login": node = viewLogin(); break;
      case "consent": node = viewConsent(); break;
      case "noroster": node = viewNoRoster(); break;
      case "nosession": node = viewNoSession(); break;
      case "student": node = S.showRefl ? viewReflection() : viewStudent(); break;
      case "teacher": node = viewTeacher(); break;
      case "prep": node = viewPrep(); break;
      default: node = h("div", { class: "narrow" }, h("div", { class: "card" }, h("p", null, "載入中…")));
    }
  } catch (e) {
    console.error(e);
    node = h("div", { class: "narrow" }, h("div", { class: "card bad" }, h("h2", null, "畫面發生錯誤"), h("p", null, String(e && e.message || e))));
  }
  S.rendering = true;
  try { root.replaceChildren(node); } finally { S.rendering = false; }
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) {
      el.focus({ preventScroll: true });
      try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {}
      el.scrollTop = keep.st;
    }
  }
  window.scrollTo(0, sy);
}

async function aiEnvCheck() {
  const ua = navigator.userAgent;
  const m = ua.match(/(Edg|Chrome)\/(\d+)/);
  const env = {
    browserName: m ? (m[1] === "Edg" ? "Edge" : "Chrome") : "其他瀏覽器",
    ver: m ? parseInt(m[2], 10) : 0,
    secure: !!window.isSecureContext,
    webgpu: !!navigator.gpu, adapter: false, gpuName: "", f16: false, maxMB: 0
  };
  env.browserOk = !!m && env.ver >= 113;
  if (navigator.gpu) {
    try {
      const ad = await navigator.gpu.requestAdapter();
      if (ad) {
        env.adapter = true;
        let info = ad.info || null;
        if (!info && ad.requestAdapterInfo) { try { info = await ad.requestAdapterInfo(); } catch (e) {} }
        env.gpuName = info ? [info.vendor, info.architecture, info.description].filter(Boolean).join(" / ") : "";
        env.f16 = !!(ad.features && ad.features.has("shader-f16"));

/* 產生回應。回傳 { response, original, converted, seconds, tokens, finish } */
async function aiGenerate(userPrompt, mode) {
  if (AI.status !== "ready" || !AI.engine) throw new Error("AI 尚未載入");
  await ensureConverter();
  const messages = [{ role: "system", content: mode === "translate" ? SYS_TRANSLATE : SYS_FREE }];
  if (mode === "translate") {
    messages.push({ role: "user", content: AI_INSTR + "\n\nThe wafer was cleaned in the cleanroom." });
    messages.push({ role: "assistant", content: "晶圓在無塵室中完成清洗。" });
  }
  messages.push({ role: "user", content: userPrompt });
  const req = { messages, temperature: 0.2, max_tokens: 768, stream: true, stream_options: { include_usage: true } };
  if (AI.modelId.startsWith("Qwen3")) req.extra_body = { enable_thinking: false };
  const t0 = performance.now();
  let raw = "", usage = null, finish = "", n = 0;
  const chunks = await AI.engine.chat.completions.create(req);
  for await (const c of chunks) {
    if (AI.stop) { try { AI.engine.interruptGenerate(); } catch (e) {} break; }
    n++;
    const ch = c.choices && c.choices[0];
    if (ch && ch.finish_reason) finish = ch.finish_reason;
    const d = ch && ch.delta && ch.delta.content;
    if (d) { raw += d; AI.live = toTW(cleanThink(raw)); aiLiveUpdate(); }
    if (c.usage) usage = c.usage;
  }
  const seconds = Number(((performance.now() - t0) / 1000).toFixed(2));
  const original = cleanThink(raw);
  const response = toTW(original);
  if (raw === "") throw new Error("模型沒有產生任何文字（收到 " + n + " 個片段，結束原因：" + (finish || "無") + "）。請重新載入頁面再試。");
  if (original === "") throw new Error("模型只輸出了思考內容，沒有譯文。請換個說法再問一次。");
  return { response, original, converted: response !== original, seconds, tokens: usage ? usage.completion_tokens : null, finish };
}

async function aiSend(mode) {
  const t = curTask();
  if (!t || AI.busy || AI.status !== "ready") return;
  const prompt = mode === "translate" ? AI_INSTR + "\n\n" + t.sourceText : (S.aiPrompt || "").trim();
  if (!prompt) { toast("請先輸入要問 AI 的內容", "bad"); return; }
  AI.busy = true; AI.live = ""; AI.liveFor = t.id; AI.stop = false; rr();
  try {
    const r = await aiGenerate(prompt, mode);
    const doc = {
      taskId: t.id, taskCode: t.code, sessionId: S.sid, groupId: S.me.groupId, anonId: S.me.anonId,
      indTaskId: t.code + "-" + S.me.anonId, role: S.me.role, model: AI.modelId, mode, prompt,
      response: r.response, modelOriginal: r.original, convertedToTraditional: r.converted,
      seconds: r.seconds, completionTokens: r.tokens, finishReason: r.finish,
      at: S.F.serverTimestamp(), clientTime: Date.now()
    };
    let saved = false;
    for (let i = 0; i < 2 && !saved; i++) {
      try { await S.F.addDoc(col("aiLogs"), doc); saved = true; } catch (e) { if (i === 1) throw e; }
    }
    try { await logEvent(t, "ai_prompt", { detail: mode }); } catch (e) { console.error(e); }
    if (mode === "free") S.aiPrompt = "";
  } catch (e) {
    console.error(e);
    toast("AI 發生問題：" + friendly(e), "bad");
  } finally {
    AI.busy = false; AI.live = ""; rr();
  }
}

const chip = (t, mono) => h("span", { class: "chip" + (mono ? "" : " t") }, t);
const versionsOf = (role) => S.versions.filter((v) => v.role === role).sort(byTime);
const latestVersion = (role) => { const a = versionsOf(role); return a[a.length - 1] || null; };

function editMode(t) {
  if (!t || !S.me) return null;
  const role = S.me.role;
  if (TRANSLATORS.includes(role)) {
    if (t.status === "translating" && !(t.initialDone || {})[role]) return "translate";
    if (t.status === "revising" && (t.pending || []).includes(role)) return "revise";
  }
  if (role === "Reviewer" && t.status === "review") return "review";
  return null;
}
function seedDraft(t, mode) {
  if (!S.dr.loaded || S.dr.taskId !== t.id) return;
  const key = t.status + ":" + (t.round || 1) + ":" + mode;
  if (S.dr.baseKey === key) return;
  S.dr.baseKey = key;
  if (mode === "revise") S.dr.text = (latestVersion(S.me.role) || {}).content || "";
  else if (mode === "review") S.dr.text = (latestVersion("Reviewer") || {}).content || "";
  else S.dr.text = S.dr.text || "";
  S.dr.comments = {};
  scheduleSave();
}

function aiMatchFor(text) {
  return S.myAi.map((l) => {
    const s = overlapScores(l.response, text);
    return { logId: l.id, mode: l.mode, contained: +s.contained.toFixed(3), dice: +s.dice.toFixed(3) };
  }).filter((x) => x.contained > 0).sort((a, b) => b.contained - a.contained).slice(0, 5);
}

async function dispatchTask(item) {

async function submitTranslation(t) {
  const F = S.F, role = S.me.role, text = S.dr.text.trim();
  if (!text) throw new Error("譯文不能是空的");
  await saveDraftNow();
  const match = aiMatchFor(text);
  await F.runTransaction(S.db, async (tx) => {
    const tref = dref("tasks", t.id);
    const snap = await tx.get(tref);
    if (!snap.exists()) throw new Error("找不到這個任務");
    const cur = snap.data();
    let kind = null;
    if (cur.status === "translating" && !(cur.initialDone || {})[role]) kind = "translation";
    else if (cur.status === "revising" && (cur.pending || []).includes(role)) kind = "revision";
    if (!kind) throw new Error("目前不能提交，任務狀態已經改變。請重新整理頁面。");
    const cnt = Object.assign({}, cur.counters || {});
    cnt[role] = (cnt[role] || 0) + 1;
    const label = ROLE_SHORT[role] + "-v" + cnt[role];
    tx.set(F.doc(F.collection(S.db, "tasks", t.id, "versions")), {
      taskId: t.id, taskCode: cur.code, sessionId: S.sid, groupId: S.me.groupId, anonId: S.me.anonId,
      indTaskId: cur.code + "-" + S.me.anonId, role, vLabel: label, kind, toRole: "Reviewer",
      round: cur.round || 1, content: text, comment: "", aiMatch: match,
      at: F.serverTimestamp(), clientTime: Date.now()
    });
    tx.set(F.doc(col("events")), evBase({ id: t.id, code: cur.code }, "submit", { toRole: "Reviewer", vLabel: label, detail: kind }));
    const upd = { counters: cnt, updatedAt: F.serverTimestamp() };
    if (kind === "translation") {
      const done = Object.assign({}, cur.initialDone || {});
      done[role] = true;
      upd.initialDone = done;
      if (TRANSLATORS.every((r) => done[r])) upd.status = "review";
    } else {
      const pend = (cur.pending || []).filter((r) => r !== role);
      upd.pending = pend;
      if (pend.length === 0) { upd.status = "review"; upd.round = (cur.round || 1) + 1; }
    }
    tx.update(tref, upd);
  });
}

  const cur = S.dr.text;
  let s = cur.length;
  if (S.caret && S.caret.taskId === t.id) s = Math.min(S.caret.s, cur.length);
  S.dr.text = cur.slice(0, s) + txt + cur.slice(s);
  S.caret = { taskId: t.id, s: s + txt.length, e: s + txt.length };
  scheduleSave();
  logEvent(t, type, extra).catch((e) => console.error(e));
  rr();
  setTimeout(() => {
    const el = document.getElementById("editor");
    if (el) { el.focus(); try { el.setSelectionRange(S.caret.s, S.caret.e); } catch (e) {} }
  }, 40);
}

async function ensureAnon(email) {
  const T = S.T;
  if (T.anon[email]) return T.anon[email];
  const used = new Set(Object.values(T.anon));
  let id;
  const span = used.size < 700 ? [100, 900] : [1000, 9000];
  do { id = "A-" + (Math.floor(Math.random() * span[1]) + span[0]); } while (used.has(id));
  await S.F.setDoc(dref("anonmap", email), { email, anonId: id, createdAt: S.F.serverTimestamp() });
  T.anon[email] = id;
  return id;
}
async function addRoster(email, groupId, role) {
  const T = S.T;
  email = String(email || "").trim().toLowerCase();
  groupId = String(groupId || "").trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error("Email 格式不正確：" + email);
  if (!groupId) throw new Error("請填組別（例如 G01）：" + email);
  if (!ROLES.includes(role)) throw new Error("角色不正確：" + email);

async function importRoster() {
  const rows = parseCsv(S.T.imp);
  if (!rows.length) throw new Error("請先貼上名單（欄位：email、組別、角色）");
  if (!String(rows[0][0] || "").includes("@")) rows.shift();
  const errs = [];

function groupChecks() {
  const m = {};
  S.T.roster.forEach((r) => { (m[r.groupId] = m[r.groupId] || []).push(r.role); });
  return Object.keys(m).sort().map((g) => {

      if (n === 0) problems.push("缺 " + role);
      if (n > 1) problems.push(role + " 重複 " + n + " 人");
    });
    return { g, problems };
  });
}

function fmtDur(ms) {
  if (ms == null || isNaN(ms)) return "";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + " 秒";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " 分 " + (s % 60) + " 秒";
  return Math.floor(m / 60) + " 小時 " + (m % 60) + " 分";
}

/* 流程比對：把實際的事件順序和預定流程逐步對照 */
function analyzeFlow(task, allEvents) {
  const ev = allEvents.filter((e) => e.taskId === task.id).sort(byTime);
  const first = (fn) => ev.find(fn);
  const last = (fn) => { const a = ev.filter(fn); return a[a.length - 1]; };
  const steps = [];
  const push = (step, detail, kind, flag) => steps.push({ step, detail, kind, flag });

  const disp = first((e) => e.type === "dispatch");
  push("1 派發任務", disp ? "PM（" + disp.anonId + "）派發，" + fmtFull(recMs(disp)) : "找不到派發紀錄", disp && ev[0] === disp ? "ok" : "warn", disp && ev[0] === disp ? "符合" : "需人工確認");

  const sub = (role) => first((e) => e.type === "submit" && e.role === role && e.detail === "translation");
  const s1 = sub("Translator 1"), s2 = sub("Translator 2");
  push("2 Translator 1 初次提交", s1 ? s1.anonId + " 提交 " + s1.vLabel + (disp ? "，距派發 " + fmtDur(recMs(s1) - recMs(disp)) : "") : "尚未提交", s1 ? "ok" : "off", s1 ? "符合" : "進行中");
  push("3 Translator 2 初次提交", s2 ? s2.anonId + " 提交 " + s2.vLabel + (disp ? "，距派發 " + fmtDur(recMs(s2) - recMs(disp)) : "") : "尚未提交", s2 ? "ok" : "off", s2 ? "符合" : "進行中");

  const rv = first((e) => e.type === "review_return" || e.type === "review_complete");
  if (!rv) push("4 Reviewer 審校", "尚未開始", "off", "進行中");
  else {
    const okOrder = s1 && s2 && recMs(rv) >= Math.max(recMs(s1), recMs(s2));
    push("4 Reviewer 審校", rv.anonId + " 首次審校動作：" + EVENT_LABEL[rv.type] + "，" + fmtFull(recMs(rv)), okOrder ? "ok" : "warn", okOrder ? "符合" : "需人工確認");
  }

  const nRet = ev.filter((e) => e.type === "review_return").length;
  const nPm = ev.filter((e) => e.type === "pm_return").length;
  const nRev = ev.filter((e) => e.type === "submit" && e.detail === "revision").length;
  push("5 修改往返", "Reviewer 送回 " + nRet + " 次、PM 退回 " + nPm + " 次、Translator 修改後再提交 " + nRev + " 次",
    nRet + nPm > 3 ? "warn" : "ok", nRet + nPm > 3 ? "往返偏多" : "符合");

  const rc = last((e) => e.type === "review_complete");
  const pc = first((e) => e.type === "pm_confirm");
  if (pc) {
    const good = rc && recMs(pc) >= recMs(rc);
    push("6 PM 最終確認", pc.anonId + " 確認，" + fmtFull(recMs(pc)) + (disp ? "；全程 " + fmtDur(recMs(pc) - recMs(disp)) : ""), good ? "ok" : "warn", good ? "符合" : "需人工確認");
  } else push("6 PM 最終確認", task.status === "pm_check" ? "等待 PM 確認" : "尚未完成", "off", "進行中");

  const ai = (role) => ev.filter((e) => e.role === role && e.type === "ai_prompt").length;
  const ins = (role) => ev.filter((e) => e.role === role && e.type === "ai_insert").length;
  const gl = (role) => ev.filter((e) => e.role === role && e.type === "glossary_insert").length;
  push("補充：AI 與術語表使用",
    ["Translator 1", "Translator 2", "Reviewer"].map((r) => ROLE_SHORT[r] + "：提問 " + ai(r) + "、插入 AI " + ins(r) + "、插入術語 " + gl(r)).join("；"), "", "僅供參考");
  return steps;
}

function dataRows(set) {
  const T = S.T, d = T.data;
  if (!d) return [];
  const sname = sessionName(T.viewSid);
  const ts = (r) => { const m = recMs(r); return m ? new Date(m).toISOString() : ""; };
  const base = (r) => Object.assign({}, flatten(r), { session: sname, timestamp: ts(r) });
  if (set === "events") return d.events.map(base);
  if (set === "versions") return d.versions.map(base);
  if (set === "aiLogs") return d.ai.map(base);
  if (set === "reflections") return d.refl.map((r) => Object.assign(base(r), { answers: JSON.stringify(r.answers || []) }));
  if (set === "tasks") return d.tasks.map((t) => { const x = base(t); delete x.sourceText; delete x.finalText; return Object.assign(x, { sourceChars: (t.sourceText || "").length, finalChars: (t.finalText || "").length }); });
  if (set === "flow") {
    const out = [];
    d.tasks.forEach((t) => analyzeFlow(t, d.events).forEach((s) => out.push({ session: sname, groupId: t.groupId, taskCode: t.code, step: s.step, flag: s.flag, detail: s.detail })));
    return out;
  }
  return [];
}

function exportFields(rows) {
  const pref = ["session", "groupId", "indTaskId", "taskCode", "role", "anonId", "timestamp", "type", "vLabel", "kind", "toRole", "mode", "model", "prompt", "response", "modelOriginal", "convertedToTraditional", "content", "detail"];
  const all = new Set();
  rows.forEach((r) => Object.keys(r).forEach((k) => all.add(k)));
  const rest = [...all].filter((k) => !pref.includes(k)).sort();
  return pref.filter((k) => all.has(k)).concat(rest);
}
function doExport() {
  const T = S.T;

  const stamp = new Date().toISOString().slice(0, 10);
  const name = T.exp.set + "-" + sessionName(T.viewSid) + "-" + stamp;
  if (T.exp.fmt === "csv") download(name + ".csv", toCsv(rows.map(pick), fields), "text/csv");
