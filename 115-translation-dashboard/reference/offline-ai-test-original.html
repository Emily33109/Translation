<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>離線 AI 翻譯測試頁</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F1; --card:#FFFFFF; --line:#D9DDD8; --ink:#1B2320; --mute:#5B6661;
  --accent:#0E6B62; --accent-ink:#0A4F48; --ok-bg:#E2F0EE; --ok-line:#A9CFCA;
  --warn-bg:#FBEFD5; --warn-line:#E3C98A; --warn-ink:#6B4600; --bad-bg:#F6DADA; --bad-ink:#6E1F1F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 'Noto Sans TC',system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px}
h2{margin:0;font-size:18px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row .l{display:flex;flex-direction:column;flex:1 1 240px}
.row .l small{color:var(--mute);font-size:13px;line-height:1.6}
.badge{padding:4px 10px;border-radius:6px;font-size:13px;font-weight:700;background:#ECEEEB;color:#3F4A45}
.badge.ok{background:var(--ok-bg);color:var(--accent-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink)}
label{font-size:14px;color:var(--mute)}
select,textarea,input[type=text]{width:100%;font:400 16px/1.7 'Noto Sans TC',sans-serif;color:var(--ink);padding:10px 12px;border:1px solid #B9C0BB;border-radius:8px;background:#fff}
select{min-height:44px;padding:0 12px}
textarea{resize:vertical;min-height:110px}
button{min-height:44px;padding:0 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:700 15px 'Noto Sans TC',sans-serif;cursor:pointer}
button.ghost{background:#fff;color:var(--accent-ink);border:1px solid var(--accent)}
button:disabled{background:#C9CFCB;color:#4A5450;border-color:#C9CFCB;cursor:not-allowed}
.bar{height:14px;background:#ECEEEB;border-radius:7px;overflow:hidden}
.bar>div{height:14px;background:var(--accent);width:0%}
.mono{font:500 13px 'IBM Plex Mono',monospace;color:var(--mute);word-break:break-word}
.out{white-space:pre-wrap;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:8px;padding:12px 14px;min-height:56px}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);color:#3D2A00;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{border-bottom:2px solid var(--ink);color:var(--mute);font-size:13px}
td.m{font:500 12px 'IBM Plex Mono',monospace}
.cell{max-width:260px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">

<header>
<h1>離線 AI 翻譯測試頁</h1>
<div class="sub">在瀏覽器裡直接跑小型 AI 模型，不需要安裝軟體。第一次要下載模型，之後會存在這個瀏覽器裡。</div>
</header>

<section class="card">
<h2>步驟 1　檢查這台電腦</h2>
<div class="btns"><button id="btnCheck">檢查</button></div>
<div id="envRows"></div>
</section>

<section class="card">
<h2>步驟 2　載入模型</h2>
<label for="model">模型</label>
<select id="model">
<option value="Qwen3-0.6B-q4f16_1-MLC">Qwen3 0.6B（q4f16，約需 1.4GB 顯示記憶體）</option>
<option value="Qwen3-0.6B-q4f32_1-MLC">Qwen3 0.6B（q4f32，約需 1.9GB，沒有 shader-f16 時用）</option>
<option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5 0.5B Instruct（q4f16，備選）</option>
<option value="Qwen3.5-0.8B-q4f16_1-MLC">Qwen3.5 0.8B（q4f16，比較大）</option>
</select>
<div class="btns"><button id="btnLoad">下載並載入模型</button></div>
<div class="bar"><div id="bar"></div></div>
<div class="mono" id="loadStatus">尚未載入</div>
</section>

<section class="card">
<h2>步驟 3　翻譯</h2>
<label for="instr">給 AI 的指令（會連同原文一起送出，也會被記錄）</label>
<input type="text" id="instr" value="請把下列英文翻譯成繁體中文（台灣用語），只輸出譯文：">
<label for="src">原文</label>
<textarea id="src">The wafer yield improved after the etching process was adjusted.</textarea>
<div class="btns">
<button id="btnGo" disabled>翻譯</button>
<button id="btnStop" class="ghost" disabled>停止</button>
<span class="mono" id="speed"></span>
</div>
<label style="display:flex;align-items:center;gap:8px;min-height:44px;color:var(--ink)"><input type="checkbox" id="optConv" checked style="width:18px;height:18px;margin:0">自動把簡體字轉成繁體（台灣用語）</label>
<div class="mono" id="convStatus">尚未載入簡轉繁工具（第一次翻譯時會載入）</div>
<label>AI 回應</label>
<div class="out" id="out" aria-live="polite"></div>
</section>

<section class="card">
<div class="btns" style="justify-content:space-between">
<h2>使用紀錄</h2>
<div class="btns">
<button class="ghost" id="btnJson" disabled>下載 JSON</button>
<button class="ghost" id="btnClear" disabled>清除紀錄</button>
</div>
</div>
<div class="sub">每次翻譯都會記下時間、模型、指令、原文、AI 回應與速度。紀錄只存在這個頁面的記憶體裡，重新整理就會消失，所以請在結束前下載。</div>
<div class="table"><table>
<thead><tr><th>時間</th><th>模型</th><th>指令與原文</th><th>AI 回應</th><th>速度</th></tr></thead>
<tbody id="logBody"></tbody>
</table></div>
</section>

<div class="note">這是測試用的頁面，還沒有登入、角色與交接流程。小模型的翻譯可能漏譯、誤譯，或夾雜簡體字，請用真實的半導體文字多試幾次，再決定要不要採用。</div>

</div>

<script type="module">
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.83/+esm";
const $ = (id) => document.getElementById(id);

let webllm = null;
let engine = null;
let loadedModel = '';
let stopFlag = false;
const logs = [];
let converter = null;
let convTried = false;
const OPENCC_URL = "https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/esm/full.js";

async function ensureConverter() {
  if (converter || convTried) return;
  convTried = true;
  try {
    const mod = await import(OPENCC_URL);
    const OpenCC = mod.default || mod;
    converter = OpenCC.Converter({ from: 'cn', to: 'twp' });
    $('convStatus').textContent = '簡轉繁工具已載入';
  } catch (e) {
    converter = null;
    $('convStatus').textContent = '簡轉繁工具載入失敗，這次只靠提示詞要求繁體';
  }
}
function toTW(t) {
  if (!converter || !$('optConv').checked) return t;
  try { return converter(t); } catch (e) { return t; }
}

function badge(text, kind) {
  const s = document.createElement('span');
  s.className = 'badge ' + (kind || '');
  s.textContent = text;
  return s;
}
function addRow(box, label, hint, value, kind) {
  const r = document.createElement('div');
  r.className = 'row';
  const l = document.createElement('div');
  l.className = 'l';
  const a = document.createElement('span');
  a.textContent = label;
  const b = document.createElement('small');
  b.textContent = hint;
  l.append(a, b);
  r.append(l, badge(value, kind));
  box.append(r);
}
function stamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

async function checkEnv() {
  const box = $('envRows');
  box.textContent = '';
  const ua = navigator.userAgent;
  const m = ua.match(/(Edg|Chrome)\/(\d+)/);
  const ver = m ? parseInt(m[2], 10) : 0;
  addRow(box, '瀏覽器', '需要 Chrome 或 Edge 113 以上', m ? (m[1] === 'Edg' ? 'Edge ' : 'Chrome ') + ver : '不是 Chrome / Edge', ver >= 113 ? 'ok' : 'bad');
  addRow(box, '安全環境', '需要 https 或 localhost，否則模型無法存進瀏覽器', window.isSecureContext ? '是' : '否', window.isSecureContext ? 'ok' : 'warn');

  if (!navigator.gpu) {
    addRow(box, 'WebGPU', '沒有 WebGPU 就無法在瀏覽器中跑模型', '不支援', 'bad');
    return;
  }
  let adapter = null;
  try { adapter = await navigator.gpu.requestAdapter(); } catch (e) { adapter = null; }
  if (!adapter) {
    addRow(box, 'WebGPU', '找不到可用的顯示卡', '無法取得', 'bad');
    return;
  }
  addRow(box, 'WebGPU', '已找到顯示卡介面', '支援', 'ok');
  let info = adapter.info || null;
  if (!info && adapter.requestAdapterInfo) { try { info = await adapter.requestAdapterInfo(); } catch (e) {} }
  const gpuName = info ? [info.vendor, info.architecture, info.description].filter(Boolean).join(' / ') : '（瀏覽器未提供）';
  addRow(box, '顯示卡', '瀏覽器回報的資訊', gpuName || '（瀏覽器未提供）', '');
  const f16 = adapter.features && adapter.features.has('shader-f16');
  addRow(box, 'shader-f16', '有的話可用 q4f16 版本（較省記憶體）；沒有就要用 q4f32 版本', f16 ? '支援' : '不支援', f16 ? 'ok' : 'warn');
  const mb = adapter.limits ? Math.round(adapter.limits.maxBufferSize / 1048576) : 0;
  addRow(box, '單一緩衝區上限', '瀏覽器允許的單塊顯示記憶體大小（不等於顯示記憶體總量）', mb + ' MB', mb >= 1024 ? 'ok' : 'warn');
  addRow(box, '顯示記憶體總量', '瀏覽器無法直接查詢，請在工作管理員的效能頁看「專用 GPU 記憶體」', '請手動確認', 'warn');
  $('model').value = f16 ? 'Qwen3-0.6B-q4f16_1-MLC' : 'Qwen3-0.6B-q4f32_1-MLC';
}

async function loadModel() {
  const id = $('model').value;
  $('btnLoad').disabled = true;
  $('btnGo').disabled = true;
  $('bar').style.width = '0%';
  $('loadStatus').textContent = '載入函式庫…';
  try {
    if (!webllm) webllm = await import(WEBLLM_URL);
    if (engine && loadedModel !== id) { try { await engine.unload(); } catch (e) {} engine = null; }
    $('loadStatus').textContent = '開始載入 ' + id;
    engine = await webllm.CreateMLCEngine(id, {
      initProgressCallback: (r) => {
        $('bar').style.width = Math.round((r.progress || 0) * 100) + '%';
        $('loadStatus').textContent = r.text || '';
      }
    });
    loadedModel = id;
    $('bar').style.width = '100%';
    $('loadStatus').textContent = '已載入：' + id;
    $('btnGo').disabled = false;
  } catch (e) {
    engine = null;
    $('loadStatus').textContent = '載入失敗：' + (e && e.message ? e.message : e);
  }
  $('btnLoad').disabled = false;
}

function cleanThink(t) {
  return t.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/<think>[\s\S]*$/, '').trim();
}

async function translate() {
  if (!engine) return;
  const instr = $('instr').value.trim();
  const src = $('src').value.trim();
  if (!src) return;
  const prompt = instr + '\n\n' + src;
  $('btnGo').disabled = true;
  $('btnStop').disabled = false;
  $('out').textContent = '';
  $('speed').textContent = '';
  stopFlag = false;
  if ($('optConv').checked) await ensureConverter();
  let raw = '';
  let usage = null;
  let nChunks = 0;
  let finish = '';
  const t0 = performance.now();
  let tFirst = 0;
  try {
    const req = {
      messages: [
        { role: 'system', content: '你是半導體產業的專業翻譯。譯文必須使用繁體中文（台灣用語），絕對不可以使用簡體字。只輸出譯文，不要解釋。' },
        { role: 'user', content: instr + '\n\nThe wafer was cleaned in the cleanroom.' },
        { role: 'assistant', content: '晶圓在無塵室中完成清洗。' },
        { role: 'user', content: prompt }
      ],
      temperature: 0.2,
      max_tokens: 768,
      stream: true,
      stream_options: { include_usage: true }
    };
    if (loadedModel.startsWith('Qwen3')) req.extra_body = { enable_thinking: false };
    const chunks = await engine.chat.completions.create(req);
    for await (const c of chunks) {
      if (stopFlag) { try { engine.interruptGenerate(); } catch (e) {} break; }
      nChunks++;
      const ch = c.choices && c.choices[0];
      const d = ch && ch.delta && ch.delta.content;
      if (ch && ch.finish_reason) finish = ch.finish_reason;
      if (d) {
        if (!tFirst) tFirst = performance.now();
        raw += d;
        const shown = toTW(cleanThink(raw));
        $('out').textContent = shown !== '' ? shown : '（模型正在思考，尚未開始輸出譯文…）';
      }
      if (c.usage) usage = c.usage;
    }
    if (raw === '') {
      $('out').textContent = '模型沒有產生任何文字。收到 ' + nChunks + ' 個資料片段，結束原因：' + (finish || '無') + '。請重新載入頁面再試，並把這行字回報給我。';
    } else if (cleanThink(raw) === '') {
      $('out').textContent = '模型只輸出了思考內容，沒有譯文。原始輸出如下：\n' + raw;
    }
  } catch (e) {
    $('out').textContent = '發生錯誤：' + (e && e.message ? e.message : e);
  }
  const sec = (performance.now() - t0) / 1000;
  let speed = '耗時 ' + sec.toFixed(1) + ' 秒';
  if (usage && usage.completion_tokens && tFirst) {
    const gen = (performance.now() - tFirst) / 1000;
    if (gen > 0) speed += '，約 ' + (usage.completion_tokens / gen).toFixed(1) + ' tokens/秒';
  }
  $('speed').textContent = speed;
  const cleanedRaw = cleanThink(raw);
  const finalText = toTW(cleanedRaw);
  const changed = finalText !== cleanedRaw;
  logs.push({
    time: stamp(),
    model: loadedModel,
    instruction: instr,
    source: src,
    response: finalText,
    model_original: cleanedRaw,
    converted_to_traditional: changed,
    raw_output: raw,
    finish_reason: finish || null,
    seconds: Number(sec.toFixed(2)),
    completion_tokens: usage ? usage.completion_tokens : null
  });
  renderLog();
  $('btnGo').disabled = false;
  $('btnStop').disabled = true;
}

function renderLog() {
  const body = $('logBody');
  body.textContent = '';
  logs.forEach((l) => {
    const tr = document.createElement('tr');
    const cells = [
      [l.time, 'm'],
      [l.model, 'm'],
      [l.instruction + '\n' + l.source, 'cell'],
      [l.response + (l.converted_to_traditional ? '\n（已自動簡轉繁，模型原文：' + l.model_original + '）' : ''), 'cell'],
      [l.seconds + ' 秒' + (l.completion_tokens ? '\n' + l.completion_tokens + ' tokens' : ''), 'm']
    ];
    cells.forEach(([t, c]) => {
      const td = document.createElement('td');
      td.className = c;
      td.textContent = t;
      tr.append(td);
    });
    body.append(tr);
  });
  $('btnJson').disabled = logs.length === 0;
  $('btnClear').disabled = logs.length === 0;
}

function downloadJson() {
  const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ai-log-' + Date.now() + '.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('btnCheck').addEventListener('click', checkEnv);
$('btnLoad').addEventListener('click', loadModel);
$('btnGo').addEventListener('click', translate);
$('btnStop').addEventListener('click', () => { stopFlag = true; });
$('btnJson').addEventListener('click', downloadJson);
$('btnClear').addEventListener('click', () => { logs.length = 0; renderLog(); });
checkEnv();
</script>
</body>
</html>
